function renderInPlace(tab) {
  // Re-render just the main area content to keep focus/scroll less jumpy for search inputs
  const mainEl = document.querySelector(".main");
  if (!mainEl) return;
  const activeId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  mainEl.innerHTML = renderMain();
  attachGlobalHandlers();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
  }
}

function wireInvoiceForm() {
  const form = document.getElementById("invoiceForm");
  if (!form) return;

  const itemsBody = document.getElementById("itemsBody");

  function wireRow(row) {
    row.querySelector(".item-qty").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-price").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-desc").addEventListener("change", (e) => {
      const opts = document.querySelectorAll("#productSuggestions option");
      for (const o of opts) {
        if (o.value === e.target.value) {
          const priceInput = row.querySelector(".item-price");
          if (priceInput && (!priceInput.value || Number(priceInput.value) === 0)) priceInput.value = o.dataset.price;
          recalcItemsTotal();
          break;
        }
      }
    });
    row.querySelector(".item-remove").addEventListener("click", () => {
      if (itemsBody.querySelectorAll("tr").length <= 1) { row.querySelector(".item-desc").value=""; row.querySelector(".item-qty").value=1; row.querySelector(".item-price").value=0; recalcItemsTotal(); return; }
      row.remove();
      recalcItemsTotal();
    });
  }
  itemsBody.querySelectorAll("tr").forEach(wireRow);

  document.getElementById("btnAddItem").addEventListener("click", () => {
    const idx = itemsBody.querySelectorAll("tr").length;
    const wrapper = document.createElement("tbody");
    wrapper.innerHTML = itemRow({ description: "", qty: 1, price: 0 }, idx);
    const row = wrapper.firstElementChild;
    itemsBody.appendChild(row);
    wireRow(row);
    row.querySelector(".item-desc").focus();
  });

  const dateField = document.getElementById("f_date");
  dateField.addEventListener("change", () => {
    // keep due date roughly in sync only if it wasn't manually diverged much — simplest: leave as is.
  });

  const manualNumberCb = document.getElementById("f_manualNumber");
  const numberField = document.getElementById("f_number");
  if (manualNumberCb && numberField) {
    manualNumberCb.addEventListener("change", () => {
      numberField.disabled = !manualNumberCb.checked;
      if (manualNumberCb.checked) { numberField.focus(); numberField.select(); }
    });
  }

  const docTypeField = document.getElementById("f_doctype");
  if (docTypeField) {
    docTypeField.addEventListener("change", () => {
      applyDocTypeToForm(docTypeField.value);
      recalcItemsTotal();
    });
    // Sichtbarkeit direkt beim Öffnen des Formulars korrekt setzen (wichtig z.B. beim
    // Bearbeiten eines bestehenden Lieferscheins, wo der Dokumenttyp nicht erst geändert wird).
    applyDocTypeToForm(docTypeField.value);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const editId = document.getElementById("f_editId").value;
    const customerId = document.getElementById("f_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("f_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
      deliveredQty: Number(r.querySelector(".item-delivered").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const docType = document.getElementById("f_doctype").value;
    const manualNumber = manualNumberCb && manualNumberCb.checked ? document.getElementById("f_number").value.trim() : "";
    if (manualNumberCb && manualNumberCb.checked && !manualNumber) { showToast("Bitte eine Nummer eingeben oder die manuelle Anpassung abwählen"); return; }

    const payload = {
      type: docType,
      customerId,
      date,
      dueDate: document.getElementById("f_dueDate").value || "",
      performanceDate: document.getElementById("f_performanceDate").value || "",
      deliveryTerm: document.getElementById("f_deliveryTerm").value.trim(),
      deliveryRef: document.getElementById("f_deliveryRef").value.trim(),
      paymentMethod: document.getElementById("f_paymentMethod").value,
      status: document.getElementById("f_status").value,
      items,
      bearbeiter: document.getElementById("f_bearbeiter") ? document.getElementById("f_bearbeiter").value.trim() : "",
      angebotsNr: document.getElementById("f_angebotsnr") ? document.getElementById("f_angebotsnr").value.trim() : "",
      lieferungArt: document.getElementById("f_lieferungart") ? document.getElementById("f_lieferungart").value.trim() : "",
      versandart: document.getElementById("f_versandart") ? document.getElementById("f_versandart").value.trim() : "",
      packstuecke: document.getElementById("f_packstuecke") ? (Number(document.getElementById("f_packstuecke").value) || 0) : 0,
    };

    if (editId) {
      const inv = invoiceById(editId);
      if (manualNumber) inv.number = manualNumber;
      Object.assign(inv, payload);
      await saveData();
      showToast("Aktualisiert");
      go("invoice-detail", editId);
    } else {
      let number;
      if (manualNumber) {
        number = manualNumber;
        // Nummernkreis nur weiterschieben, falls die manuelle Nummer im gültigen Schema liegt und höher ist
        const m = manualNumber.match(/^(\d{4})(\d{3,})$/);
        if (m) {
          const y = Number(m[1]), seq = Number(m[2]);
          if (DB.settings.seqYear === y && seq >= DB.settings.nextSeq) DB.settings.nextSeq = seq + 1;
          else if (DB.settings.seqYear === undefined || y > DB.settings.seqYear) { DB.settings.seqYear = y; DB.settings.nextSeq = seq + 1; }
        }
      } else {
        const info = nextInvoiceNumber(date);
        number = info.number;
        if (DB.settings.seqYear !== info.year) { DB.settings.seqYear = info.year; DB.settings.nextSeq = info.seq + 1; }
        else { DB.settings.nextSeq = info.seq + 1; }
      }
      const newInv = { id: uid("i"), number, createdBy: CURRENT_USER ? CURRENT_USER.name : "Unbekannt", ...payload };
      DB.invoices.push(newInv);
      if (VIEW.prefillOrder) {
        const ord = orderById(VIEW.prefillOrder);
        if (ord) { ord.status = "abgerechnet"; ord.invoiceId = newInv.id; }
        VIEW.prefillOrder = null;
      }
      if (VIEW.prefillQuoteToInvoice) {
        const src = quoteById(VIEW.prefillQuoteToInvoice);
        if (src) { src.status = "umgewandelt"; src.invoiceId = newInv.id; }
        VIEW.prefillQuoteToInvoice = null;
      }
      if (VIEW.prefillLieferschein) {
        const src = invoiceById(VIEW.prefillLieferschein);
        if (src) { src.invoiceId = newInv.id; if (src.status !== "storniert") src.status = "erledigt"; }
        VIEW.prefillLieferschein = null;
      }
      await saveData();
      showToast(docType === "lieferschein" ? "Lieferschein erstellt" : "Rechnung erstellt");
      go("invoice-detail", newInv.id);
    }
  });

  recalcItemsTotal();
}

    });
    row.querySelector(".item-remove").addEventListener("click", () => {
      if (itemsBody.querySelectorAll("tr").length <= 1) { row.querySelector(".item-desc").value=""; row.querySelector(".item-qty").value=1; row.querySelector(".item-price").value=0; recalcItemsTotal(); return; }
      row.remove();
      recalcItemsTotal();
    });
  }
  itemsBody.querySelectorAll("tr").forEach(wireRow);

  document.getElementById("btnAddItem").addEventListener("click", () => {
    const idx = itemsBody.querySelectorAll("tr").length;
    const wrapper = document.createElement("tbody");
    wrapper.innerHTML = itemRow({ description: "", qty: 1, price: 0 }, idx);
    const row = wrapper.firstElementChild;
    itemsBody.appendChild(row);
    wireRow(row);
    row.querySelector(".item-desc").focus();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const editId = document.getElementById("q_editId").value;
    const customerId = document.getElementById("q_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("q_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const payload = {
      customerId,
      date,
      status: document.getElementById("q_status").value,
      note: document.getElementById("q_note").value.trim(),
      items,
    };

    if (editId) {
      const q = quoteById(editId);
      Object.assign(q, payload);
      await saveData();
      showToast("Angebot aktualisiert");
      go("quote-detail", editId);
    } else {
      const info = nextQuoteNumber(date);
      const newQuote = { id: uid("q"), number: info.number, orderId: null, invoiceId: null, createdBy: CURRENT_USER ? CURRENT_USER.name : "Unbekannt", ...payload };
      DB.quotes.push(newQuote);
      if (DB.settings.quoteSeqYear !== info.year) { DB.settings.quoteSeqYear = info.year; DB.settings.quoteNextSeq = info.seq + 1; }
      else { DB.settings.quoteNextSeq = info.seq + 1; }
      await saveData();
      showToast("Angebot erstellt");
      go("quote-detail", newQuote.id);
    }
  });

  recalcItemsTotal();
}

function runPostRenderHooks() {
  if (VIEW.tab === "dashboard") drawMonthChart();
}

/* ============================================================
   Boot
   ============================================================ */

async function boot() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px;text-align:center;color:#141414;font-family:Georgia,serif;">Lade FreakyWood CRM…</div>`;
  await loadData();
  render();
}

boot();

</script>
