function renderInPlace(tab) {
  // Re-render just the main area content to keep focus/scroll less jumpy for search inputs
  const mainEl = document.querySelector(".main");
  if (!mainEl) return;
  const activeId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  mainEl.innerHTML = renderMain();
  attachGlobalHandlers();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
  }
}

function wireInvoiceForm() {
  const form = document.getElementById("invoiceForm");
  if (!form) return;

  const itemsBody = document.getElementById("itemsBody");

  function wireRow(row) {
    row.querySelector(".item-qty").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-price").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-desc").addEventListener("change", (e) => {
      const opts = document.querySelectorAll("#productSuggestions option");
      for (const o of opts) {
        if (o.value === e.target.value) {
          const priceInput = row.querySelector(".item-price");
          if (priceInput && (!priceInput.value || Number(priceInput.value) === 0)) priceInput.value = o.dataset.price;
          recalcItemsTotal();
          break;
        }
      }
    });
    row.querySelector(".item-remove").addEventListener("click", () => {
      if (itemsBody.querySelectorAll("tr").length <= 1) { row.querySelector(".item-desc").value=""; row.querySelector(".item-qty").value=1; row.querySelector(".item-price").value=0; recalcItemsTotal(); return; }
      row.remove();
      recalcItemsTotal();
    });
  }
  itemsBody.querySelectorAll("tr").forEach(wireRow);

  document.getElementById("btnAddItem").addEventListener("click", () => {
    const idx = itemsBody.querySelectorAll("tr").length;
    const wrapper = document.createElement("tbody");
    wrapper.innerHTML = itemRow({ description: "", qty: 1, price: 0 }, idx);
    const row = wrapper.firstElementChild;
    itemsBody.appendChild(row);
    wireRow(row);
    row.querySelector(".item-desc").focus();
  });

  const dateField = document.getElementById("f_date");
  dateField.addEventListener("change", () => {
    // keep due date roughly in sync only if it wasn't manually diverged much — simplest: leave as is.
  });

  const manualNumberCb = document.getElementById("f_manualNumber");
  const numberField = document.getElementById("f_number");
  if (manualNumberCb && numberField) {
    manualNumberCb.addEventListener("change", () => {
      numberField.disabled = !manualNumberCb.checked;
      if (manualNumberCb.checked) { numberField.focus(); numberField.select(); }
    });
  }

  const docTypeField = document.getElementById("f_doctype");
  if (docTypeField) {
    docTypeField.addEventListener("change", () => {
      applyDocTypeToForm(docTypeField.value);
      recalcItemsTotal();
    });
    // Sichtbarkeit direkt beim Öffnen des Formulars korrekt setzen (wichtig z.B. beim
    // Bearbeiten eines bestehenden Lieferscheins, wo der Dokumenttyp nicht erst geändert wird).
    applyDocTypeToForm(docTypeField.value);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const editId = document.getElementById("f_editId").value;
    const customerId = document.getElementById("f_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("f_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
      deliveredQty: Number(r.querySelector(".item-delivered").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const docType = document.getElementById("f_doctype").value;
    const manualNumber = manualNumberCb && manualNumberCb.checked ? document.getElementById("f_number").value.trim() : "";
    if (manualNumberCb && manualNumberCb.checked && !manualNumber) { showToast("Bitte eine Nummer eingeben oder die manuelle Anpassung abwählen"); return; }

    const payload = {
      type: docType,
      customerId,
      date,
      dueDate: document.getElementById("f_dueDate").value || "",
      performanceDate: document.getElementById("f_performanceDate").value || "",
      deliveryTerm: document.getElementById("f_deliveryTerm").value.trim(),
      deliveryRef: document.getElementById("f_deliveryRef").value.trim(),
      paymentMethod: document.getElementById("f_paymentMethod").value,
      status: document.getElementById("f_status").value,
      items,
      bearbeiter: document.getElementById("f_bearbeiter") ? document.getElementById("f_bearbeiter").value.trim() : "",
      angebotsNr: document.getElementById("f_angebotsnr") ? document.getElementById("f_angebotsnr").value.trim() : "",
      lieferungArt: document.getElementById("f_lieferungart") ? document.getElementById("f_lieferungart").value.trim() : "",
      versandart: document.getElementById("f_versandart") ? document.getElementById("f_versandart").value.trim() : "",
      packstuecke: document.getElementById("f_packstuecke") ? (Number(document.getElementById("f_packstuecke").value) || 0) : 0,
    };

    if (editId) {
      const inv = invoiceById(editId);
      if (manualNumber) inv.number = manualNumber;
      Object.assign(inv, payload);
      await saveData();
      showToast("Aktualisiert");
      go("invoice-detail", editId);
    } else {
      let number;
      if (manualNumber) {
        number = manualNumber;
        // Nummernkreis nur weiterschieben, falls die manuelle Nummer im gültigen Schema liegt und höher ist
        const m = manualNumber.match(/^(\d{4})(\d{3,})$/);
        if (m) {
          const y = Number(m[1]), seq = Number(m[2]);
          if (DB.settings.seqYear === y && seq >= DB.settings.nextSeq) DB.settings.nextSeq = seq + 1;
          else if (DB.settings.seqYear === undefined || y > DB.settings.seqYear) { DB.settings.seqYear = y; DB.settings.nextSeq = seq + 1; }
        }
      } else {
        const info = nextInvoiceNumber(date);
        number = info.number;
        if (DB.settings.seqYear !== info.year) { DB.settings.seqYear = info.year; DB.settings.nextSeq = info.seq + 1; }
        else { DB.settings.nextSeq = info.seq + 1; }
      }
      const newInv = { id: uid("i"), number, createdBy: CURRENT_USER ? CURRENT_USER.name : "Unbekannt", ...payload };
      DB.invoices.push(newInv);
      if (VIEW.prefillOrder) {
        const ord = orderById(VIEW.prefillOrder);
        if (ord) { ord.status = "abgerechnet"; ord.invoiceId = newInv.id; }
        VIEW.prefillOrder = null;
      }
      if (VIEW.prefillQuoteToInvoice) {
        const src = quoteById(VIEW.prefillQuoteToInvoice);
        if (src) { src.status = "umgewandelt"; src.invoiceId = newInv.id; }
        VIEW.prefillQuoteToInvoice = null;
      }
      if (VIEW.prefillLieferschein) {
        const src = invoiceById(VIEW.prefillLieferschein);
        if (src) { src.invoiceId = newInv.id; if (src.status !== "storniert") src.status = "erledigt"; }
        VIEW.prefillLieferschein = null;
      }
      await saveData();
      showToast(docType === "lieferschein" ? "Lieferschein erstellt" : "Rechnung erstellt");
      go("invoice-detail", newInv.id);
    }
  });

  recalcItemsTotal();
}

    row.querySelector(".item-desc").focus();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const editId = document.getElementById("q_editId").value;
    const customerId = document.getElementById("q_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("q_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const payload = {
      customerId,
      date,
      status: document.getElementById("q_status").value,
      note: document.getElementById("q_note").value.trim(),
      items,
    };

    if (editId) {
      const q = quoteById(editId);
      Object.assign(q, payload);
      await saveData();
      showToast("Angebot aktualisiert");
      go("quote-detail", editId);
    } else {
      const info = nextQuoteNumber(date);
      const newQuote = { id: uid("q"), number: info.number, orderId: null, invoiceId: null, createdBy: CURRENT_USER ? CURRENT_USER.name : "Unbekannt", ...payload };
      DB.quotes.push(newQuote);
      if (DB.settings.quoteSeqYear !== info.year) { DB.settings.quoteSeqYear = info.year; DB.settings.quoteNextSeq = info.seq + 1; }
      else { DB.settings.quoteNextSeq = info.seq + 1; }
      await saveData();
      showToast("Angebot erstellt");
      go("quote-detail", newQuote.id);
    }
  });

  recalcItemsTotal();
}

function runPostRenderHooks() {
  if (VIEW.tab === "dashboard") drawMonthChart();
  if (VIEW.tab === "settings") refreshAdminUsers();
  showRemoteBanner();
}

let SESSION_TOKEN = null;
let USER_NAMES = [];            // nur Namen – für die Anmeldeauswahl
let BASE_VERSION = null;        // Server-Version des zuletzt geladenen/gespeicherten Stands
let BASE_JSON = null;           // genau dieser Stand als JSON (für Protokoll + Zusammenführen)
let SAVE_CHAIN = Promise.resolve();
let PENDING_AFTER_LOGIN = null; // nicht gespeicherte Änderung, falls die Sitzung abgelaufen ist
let LOCK_MESSAGE = "";

let REMOTE_CHANGE = null;       // { version, by, at } – jemand anderes hat gespeichert
let POLL_TIMER = null;

class RpcError extends Error {}

async function rpc(fn, args) {
  const { data, error } = await sbClient.rpc(fn, args || {});
  if (error) {
    const msg = error.message || String(error);
    const e = new RpcError(msg);
    e.code = error.code;
    if (msg.includes("SESSION_INVALID")) {
      e.sessionInvalid = true;
      handleSessionExpired();
    }
    throw e;
  }
  return data;
}

function isSetupMissingError(e) {
  const m = (e && (e.message || "")) + " " + (e && e.code || "");
  return /PGRST202|Could not find the function|function .* does not exist|42883/i.test(m);
}

function cleanForSave(db) {
  const o = Object.assign({}, db);
  delete o.__loadError;
  return o;
}
function setBase(version, obj) {
  BASE_VERSION = version;
  BASE_JSON = JSON.stringify(cleanForSave(obj));
}
function deepClone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

function handleSessionExpired() {
  if (!APP_UNLOCKED) return;
  if (DB && BASE_JSON && JSON.stringify(cleanForSave(DB)) !== BASE_JSON) {
    PENDING_AFTER_LOGIN = { base: BASE_JSON, mine: JSON.stringify(cleanForSave(DB)), user: CURRENT_USER && CURRENT_USER.name };
  }
  APP_UNLOCKED = false;
  SESSION_TOKEN = null;
  LOCK_MESSAGE = "Deine Sitzung ist abgelaufen. Bitte erneut anmelden – nicht gespeicherte Änderungen werden danach übernommen.";
  stopPolling();
  closeModal();
  render();
}

/* ---------------- Laden ---------------- */

async function loadData() {
  const res = await rpc("crm_load", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY });
  if (!res || !res.exists) {
    // Allererster Start: Startdaten anlegen
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    ensureUserDefaults(DB);
    BASE_VERSION = null;
    BASE_JSON = null;
    await saveData(true);
    return;
  }
  DB = res.value;
  ensureUserDefaults(DB);
  setBase(res.version, DB);
  REMOTE_CHANGE = null;
}

/* ---------------- Speichern (mit Konfliktschutz) ---------------- */

function saveData(silent) {
  const p = SAVE_CHAIN.then(() => doSave(silent, false));
  SAVE_CHAIN = p.catch(() => {});
  return p;
}

async function doSave(silent, force) {
  if (!DB || DB.__loadError) {
    STORAGE_OK = false;
    showToast("⚠ Speichern gesperrt – die Daten wurden nicht korrekt geladen");
    return false;
  }
  if (!SESSION_TOKEN) {
    STORAGE_OK = false;
    showToast("⚠ Nicht angemeldet – Änderung nicht gespeichert");
    return false;
  }
  const value = cleanForSave(DB);
  const json = JSON.stringify(value);
  if (BASE_JSON !== null && json === BASE_JSON && !force) {
    STORAGE_OK = true;
    if (!silent) showToast("Gespeichert");
    return true;
  }
  const base = BASE_JSON ? JSON.parse(BASE_JSON) : null;
  const changes = base ? computeChanges(base, value) : [{ t: "Datenbestand", a: "angelegt" }];
  try {
    const res = await rpc("crm_save", {
      p_token: SESSION_TOKEN, p_key: STORAGE_KEY, p_value: value,
      p_base_version: BASE_VERSION, p_changes: changes.length ? changes : [{ t: "Daten", a: "geändert" }],
      p_force: !!force,
    });
    if (res && res.ok) {
      BASE_VERSION = res.version;
      BASE_JSON = json;
      STORAGE_OK = true;
      if (REMOTE_CHANGE && REMOTE_CHANGE.version <= res.version) REMOTE_CHANGE = null;
      if (!silent) showToast("Gespeichert");
      return true;
    }
    if (res && res.conflict) return await resolveConflict(silent, res);
    throw new Error("Unerwartete Antwort vom Server");
  } catch (e) {
    STORAGE_OK = false;
    console.error("Speicherfehler:", e);
    if (!e.sessionInvalid) showToast("⚠ Speichern fehlgeschlagen — Änderung ggf. nicht dauerhaft");
    return false;
  }
}

// Jemand anderes hat zwischenzeitlich gespeichert -> versuchen, beide Änderungen zusammenzuführen.
async function resolveConflict(silent, info) {
  const latest = await rpc("crm_load", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY });
  const theirs = latest.value;
  ensureUserDefaults(theirs);
  const base = JSON.parse(BASE_JSON);
  const mine = cleanForSave(DB);
  const result = mergeThreeWay(base, mine, theirs, false);
  const who = latest.updated_by || "jemand anderes";

  if (!result.conflicts.length) {
    DB = result.merged;
    ensureUserDefaults(DB);
    setBase(latest.version, theirs);
    const ok = await doSave(true, false);
    if (ok) {
      showToast(`Gespeichert – zusammengeführt mit Änderungen von ${who}` + (result.renumbered.length ? ` (${result.renumbered.join(", ")})` : ""));
      softRerender();
    }
    return ok;
  }
  openConflictModal(result, mine, theirs, latest, who);
  return false;
}

function openConflictModal(result, mine, theirs, latest, who) {
  const list = result.conflicts.slice(0, 12).map(c => `<li>${esc(c.label)}</li>`).join("");
  const more = result.conflicts.length > 12 ? `<li>… und ${result.conflicts.length - 12} weitere</li>` : "";
  openModal(`
    <h2>Gleichzeitige Änderung</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px;">
      <b>${esc(who)}</b> hat ${latest.updated_at ? "um " + esc(new Date(latest.updated_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })) + " " : ""}dieselben Daten geändert wie du. Diese Punkte überschneiden sich:</p>
    <ul style="font-size:13px;margin:0 0 12px;padding-left:18px;">${list}${more}</ul>
    <p style="font-size:12.5px;color:var(--ink-faint);margin:0;">Alle anderen Änderungen (von dir und von ${esc(who)}) bleiben in jedem Fall erhalten. Vor jedem Speichern wird außerdem automatisch ein Backup angelegt.</p>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button type="button" class="btn" id="btnConflictTheirs">Version von ${esc(who)} behalten</button>
      <button type="button" class="btn btn-primary" id="btnConflictMine">Meine Version verwenden</button>
    </div>
  `);
  document.getElementById("btnConflictTheirs").onclick = async () => {
    DB = result.merged;           // bei Überschneidungen: deren Stand
    ensureUserDefaults(DB);
    setBase(latest.version, theirs);
    closeModal();
    await saveData(true);
    showToast("Übernommen");
    render();
  };
  document.getElementById("btnConflictMine").onclick = async () => {
    const r2 = mergeThreeWay(JSON.parse(BASE_JSON), mine, theirs, true);
    DB = r2.merged;               // bei Überschneidungen: mein Stand
    ensureUserDefaults(DB);
    setBase(latest.version, theirs);
    closeModal();
    await saveData();
    render();
  };
}

/* ---------------- Drei-Wege-Zusammenführung ---------------- */

const COLL_LABELS = {
  customers: "Kunde", products: "Artikel", invoices: "Rechnung", orders: "Auftrag",
  quotes: "Angebot", stockItems: "Lagerartikel", materials: "Material",
};
const FIELD_LABELS = {
  status: "Status", number: "Nr.", date: "Datum", dueDate: "Fällig am", items: "Positionen", customerId: "Kunde",
  name: "Name", company: "Firma", street: "Straße", zip: "PLZ", city: "Ort", email: "E-Mail", phone: "Telefon",
  note: "Notiz", price: "Preis", stock: "Bestand", minStock: "Mindestbestand", movements: "Bewegungen",
  photo: "Foto", contacts: "Kontakte", dunning: "Mahnungen", paymentMethod: "Zahlart",
  nextSeq: "nächste Rechnungsnr.", orderNextSeq: "nächste Auftragsnr.", quoteNextSeq: "nächste Angebotsnr.",
  company_: "Firmendaten", reminderSentAt: "Erinnerung", performanceDate: "Leistungsdatum",
};

function entityLabel(coll, e) {
  if (!e) return COLL_LABELS[coll] || coll;
  if (coll === "invoices") return (e.type === "lieferschein" ? "Lieferschein " : "Rechnung ") + (e.number || e.id);
  if (coll === "orders" || coll === "quotes") return COLL_LABELS[coll] + " " + (e.number || e.id);
  if (coll === "customers") return "Kunde " + (e.name || e.id) + (e.company ? " (" + e.company + ")" : "");
  return (COLL_LABELS[coll] || coll) + " " + (e.name || e.description || e.number || e.id);
}

function isPlainObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
function isIdArr(a) { return Array.isArray(a) && a.every(x => isPlainObj(x) && typeof x.id === "string" && x.id); }

function mergeThreeWay(base, mine, theirs, preferMine) {
  const ctx = { conflicts: [], preferMine };
  const merged = mergeVal(base, mine, theirs, [], ctx) || {};
  const renumbered = fixDuplicateNumbers(merged, base);
  return { merged, conflicts: ctx.conflicts, renumbered };
}

function mergeVal(b, m, t, path, ctx) {
  const sb = JSON.stringify(b), sm = JSON.stringify(m), st = JSON.stringify(t);
  if (sm === st) return deepClone(m);
  if (sm === sb) return deepClone(t);
  if (st === sb) return deepClone(m);

  // Nummernzähler: beide haben hochgezählt -> höheren Wert nehmen (keine Rückfrage nötig)
  if (path.length === 2 && path[0] === "settings" && /NextSeq$|^nextSeq$/.test(path[1]) &&
      typeof m === "number" && typeof t === "number") return Math.max(m, t);

  if (isPlainObj(m) && isPlainObj(t) && (b === undefined || isPlainObj(b))) {
    const out = {};
    const keys = Array.from(new Set([...Object.keys(t), ...Object.keys(m)]));
    for (const k of keys) {
      const v = mergeVal(b ? b[k] : undefined, m[k], t[k], path.concat(k), ctx);
      if (v !== undefined) out[k] = v;
    }
    return out;
  }
  if (Array.isArray(m) && Array.isArray(t) && (b === undefined || Array.isArray(b)) &&
      isIdArr(m) && isIdArr(t) && (b === undefined || isIdArr(b))) {
    const coll = path[0];
    const bm = new Map((b || []).map(x => [x.id, x]));
    const mm = new Map(m.map(x => [x.id, x]));
    const tm = new Map(t.map(x => [x.id, x]));
    const order = [...t.map(x => x.id), ...m.map(x => x.id).filter(id => !tm.has(id))];
    const out = [];
    for (const id of order) {
      const label = entityLabel(coll, mm.get(id) || tm.get(id) || bm.get(id));
      const v = mergeVal(bm.get(id), mm.get(id), tm.get(id), [coll, label], ctx);
      if (v !== undefined) out.push(v);
    }
    return out;
  }
  // echte Überschneidung
  ctx.conflicts.push({ path, label: conflictLabel(path, m, t) });
  return deepClone(ctx.preferMine ? m : t);
}

function conflictLabel(path, m, t) {
  if (!path.length) return "Gesamter Datenbestand";
  const [first, ...rest] = path;
  const head = COLL_LABELS[first] ? (rest[0] || COLL_LABELS[first]) : (first === "settings" ? "Einstellungen" : first);
  const tail = (COLL_LABELS[first] ? rest.slice(1) : rest).map(k => FIELD_LABELS[k] || k);
  let txt = head + (tail.length ? " – " + tail.join(" › ") : "");
  if (m === undefined) txt += " (von dir gelöscht, dort geändert)";
  else if (t === undefined) txt += " (dort gelöscht, von dir geändert)";
  return txt;
}

// Falls zwei Personen gleichzeitig ein Dokument angelegt haben, bekommen beide dieselbe
// Nummer. Das neu von MIR angelegte Dokument erhält dann die nächste freie Nummer.
function fixDuplicateNumbers(db, base) {
  const notes = [];
  const baseIds = coll => new Set(((base && base[coll]) || []).map(x => x.id));
  const fix = (coll, re, fmt, seqKey, yearKey) => {
    const list = db[coll] || [];
    const seen = new Map();
    const bIds = baseIds(coll);
    list.forEach(x => { if (!seen.has(x.number)) seen.set(x.number, []); seen.get(x.number).push(x); });
    for (const [num, docs] of seen) {
      if (!num || docs.length < 2) continue;
      // Das erste Dokument (Bestand bzw. das der anderen Person) behält die Nummer,
      // später hinzugekommene NEUE Dokumente bekommen die nächste freie Nummer.
      docs.slice(1).filter(doc => !bIds.has(doc.id)).forEach(doc => {
        const mt = re.exec(num); if (!mt) return;
        const y = Number(mt[1]);
        let maxSeq = 0;
        list.forEach(x => { const r = re.exec(x.number || ""); if (r && Number(r[1]) === y) maxSeq = Math.max(maxSeq, Number(r[2])); });
        const newNum = fmt(y, maxSeq + 1);
        notes.push(`${COLL_LABELS[coll]} ${num} → ${newNum}`);
        doc.number = newNum;
        if (db.settings && db.settings[yearKey] === y) db.settings[seqKey] = Math.max(Number(db.settings[seqKey]) || 0, maxSeq + 2);
      });
    }
  };
  fix("invoices", /^(\d{4})(\d{3,})$/, (y, s) => `${y}${String(s).padStart(3, "0")}`, "nextSeq", "seqYear");
  fix("orders", /^A-(\d{4})-(\d+)$/, (y, s) => `A-${y}-${String(s).padStart(3, "0")}`, "orderNextSeq", "orderSeqYear");
  fix("quotes", /^AN-(\d{4})-(\d+)$/, (y, s) => `AN-${y}-${String(s).padStart(3, "0")}`, "quoteNextSeq", "quoteSeqYear");
  return notes;
}

/* ---------------- Änderungsprotokoll: was hat sich geändert? ---------------- */

function shortVal(v) {
  if (v === undefined || v === null || v === "") return "–";
  if (typeof v === "string" && v.startsWith("data:")) return "Bild";
  if (typeof v === "object") return Array.isArray(v) ? `${v.length} Einträge` : "…";
  const s = String(v);
  return s.length > 40 ? s.slice(0, 38) + "…" : s;
}

function fieldDiffs(b, c) {
  const out = [];
  const keys = Array.from(new Set([...Object.keys(b || {}), ...Object.keys(c || {})]));
  for (const k of keys) {
    const sb = JSON.stringify(b ? b[k] : undefined), sc = JSON.stringify(c ? c[k] : undefined);
    if (sb === sc) continue;
    const lbl = FIELD_LABELS[k] || k;
    const bv = b ? b[k] : undefined, cv = c ? c[k] : undefined;
    if ((bv !== null && typeof bv === "object") || (cv !== null && typeof cv === "object") ||
        (typeof cv === "string" && cv.startsWith("data:"))) out.push(lbl);
    else out.push(`${lbl}: ${shortVal(bv)} → ${shortVal(cv)}`);
  }
  return out;
}

function computeChanges(base, cur) {
  const out = [];
  const keys = Array.from(new Set([...Object.keys(base || {}), ...Object.keys(cur || {})]));
  for (const k of keys) {
    const b = base[k], c = cur[k];
    if (JSON.stringify(b) === JSON.stringify(c)) continue;
    if ((isIdArr(b) || b === undefined) && (isIdArr(c) || c === undefined)) {
      const bm = new Map((b || []).map(x => [x.id, x]));
      const cm = new Map((c || []).map(x => [x.id, x]));
      for (const [id, x] of cm) {
        if (!bm.has(id)) out.push({ t: entityLabel(k, x), a: "neu" });
        else if (JSON.stringify(bm.get(id)) !== JSON.stringify(x)) out.push({ t: entityLabel(k, x), a: "geändert", f: fieldDiffs(bm.get(id), x).slice(0, 8) });
      }
      for (const [id, x] of bm) if (!cm.has(id)) out.push({ t: entityLabel(k, x), a: "gelöscht" });
    } else if (k === "settings" && isPlainObj(b) && isPlainObj(c)) {
      const f = [];
      for (const sk of Array.from(new Set([...Object.keys(b), ...Object.keys(c)]))) {
        if (sk === "users") continue;
        if (JSON.stringify(b[sk]) === JSON.stringify(c[sk])) continue;
        if (isPlainObj(b[sk]) || isPlainObj(c[sk])) fieldDiffs(b[sk], c[sk]).forEach(x => f.push((sk === "company" ? "Firma " : sk + " ") + x));
        else f.push(`${FIELD_LABELS[sk] || sk}: ${shortVal(b[sk])} → ${shortVal(c[sk])}`);
      }
      if (f.length) out.push({ t: "Einstellungen", a: "geändert", f: f.slice(0, 10) });
    } else {
      out.push({ t: k, a: "geändert" });
    }
    if (out.length > 60) break;
  }
  return out.slice(0, 60);
}

/* ---------------- Live-Abgleich: hat jemand anderes gespeichert? ---------------- */

function startPolling() {
  stopPolling();
  POLL_TIMER = setInterval(checkRemoteVersion, 45000);
}
function stopPolling() { if (POLL_TIMER) clearInterval(POLL_TIMER); POLL_TIMER = null; }

function isEditingView() {
  return /-new$|-edit$/.test(VIEW.tab) || VIEW.tab === "settings" || !!document.getElementById("modalOverlay");
}

async function checkRemoteVersion() {
  if (!APP_UNLOCKED || !SESSION_TOKEN || document.hidden) return;
  try {
    const v = await rpc("crm_version", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY });
    if (!v || !v.version || BASE_VERSION === null || v.version <= BASE_VERSION) return;
    const dirty = DB && JSON.stringify(cleanForSave(DB)) !== BASE_JSON;
    if (!dirty && !isEditingView()) {
      await loadData();
      softRerender();
      showToast(`Aktualisiert – neue Änderungen von ${v.updated_by || "jemand anderem"}`);
    } else {
      REMOTE_CHANGE = { version: v.version, by: v.updated_by, at: v.updated_at };
      showRemoteBanner();
    }
  } catch (e) { /* still – nächster Versuch beim nächsten Intervall */ }
}

function showRemoteBanner() {
  let el = document.getElementById("remoteBanner");
  if (!REMOTE_CHANGE) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "remoteBanner";
    el.className = "remote-banner no-print";
    document.body.appendChild(el);
  }
  el.innerHTML = `<span><b>${esc(REMOTE_CHANGE.by || "Jemand")}</b> hat gerade Änderungen gespeichert.</span>
    <button class="btn btn-sm" id="btnRemoteReload">Aktualisieren</button>`;
  document.getElementById("btnRemoteReload").onclick = async () => {
    const dirty = DB && JSON.stringify(cleanForSave(DB)) !== BASE_JSON;
    if (dirty) { await saveData(true); } else { await loadData(); }
    REMOTE_CHANGE = null;
    showRemoteBanner();
    render();
  };
}

function softRerender() {
  if (!APP_UNLOCKED || !DB) return;
  if (isEditingView()) return;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

async function doLogin(name, pin) {
  const res = await rpc("crm_login", { p_name: name, p_pin: pin });
  if (!res || !res.ok) {
    if (res && res.error === "LOCKED") {
      const until = res.locked_until ? new Date(res.locked_until).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
      const day = res.locked_until && new Date(res.locked_until).toDateString() !== new Date().toDateString()
        ? new Date(res.locked_until).toLocaleDateString("de-DE") + " " : "";
      return { ok: false, msg: `Zu viele Fehlversuche. Anmeldung gesperrt bis ${day}${until} Uhr. Ein Admin kann die PIN zurücksetzen.` };
    }
    return { ok: false, msg: "Falscher PIN. Bitte erneut versuchen." };
  }
  SESSION_TOKEN = res.token;
  CURRENT_USER = { name: res.name, role: res.role || "user" };
  return { ok: true };
}

async function afterLogin() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px;text-align:center;color:#141414;font-family:Georgia,serif;">Lade Daten…</div>`;
  try {
    await loadData();
  } catch (e) {
    console.error(e);
    DB = null;
    APP_UNLOCKED = false;
    LOCK_MESSAGE = "Daten konnten nicht geladen werden: " + (e.message || e);
    render();
    return;
  }
  APP_UNLOCKED = true;
  LOCK_MESSAGE = "";
  if (PENDING_AFTER_LOGIN && PENDING_AFTER_LOGIN.user === CURRENT_USER.name) {
    const p = PENDING_AFTER_LOGIN;
    PENDING_AFTER_LOGIN = null;
    const theirs = DB;
    const r = mergeThreeWay(JSON.parse(p.base), JSON.parse(p.mine), theirs, true);
    DB = r.merged;
    ensureUserDefaults(DB);
    await saveData(true);
    showToast("Deine letzte Änderung wurde nachträglich gespeichert");
  } else {
    PENDING_AFTER_LOGIN = null;
  }
  startPolling();
  render();
}

async function doLogout() {
  const tok = SESSION_TOKEN;
  try { await SAVE_CHAIN; } catch (e) {}
  APP_UNLOCKED = false;
  CURRENT_USER = null;
  SESSION_TOKEN = null;
  DB = null;
  BASE_JSON = null;
  BASE_VERSION = null;
  REMOTE_CHANGE = null;
  showRemoteBanner();
  stopPolling();
  VIEW = { tab: "dashboard", id: null };
  render();
  if (tok) { try { await rpc("crm_logout", { p_token: tok }); } catch (e) {} }
}

// PIN des angemeldeten Benutzers serverseitig prüfen (z. B. beim Löschen)
async function verifyOwnPin(pin) {
  try {
    const res = await rpc("crm_verify_pin", { p_token: SESSION_TOKEN, p_pin: pin });
    if (res && res.ok) return { ok: true };
    if (res && res.error === "LOCKED") return { ok: false, msg: "Zu viele Fehlversuche – bitte später erneut versuchen." };
    return { ok: false, msg: "Falsche PIN." };
  } catch (e) {
    return { ok: false, msg: e.sessionInvalid ? "Sitzung abgelaufen." : "Prüfung fehlgeschlagen: " + e.message };
  }
}

/* ============================================================
   BRIEFPAPIER (Vektor) – ersetzt das unscharfe Hintergrundbild
   ------------------------------------------------------------
   Logo als SVG, Fußzeile als echter Text aus den Firmendaten.
   Positionen exakt vom bisherigen Briefpapier übernommen (in mm).
   Umschaltbar unter Einstellungen → Briefpapier (alt/neu).
   ============================================================ */

function useVectorLetterhead() {
  return !(DB && DB.settings && DB.settings.letterheadMode === "image");
}
function letterheadSheetStyle() {
  return useVectorLetterhead() ? "" : `background-image:url('${LETTERHEAD_BG}');`;
}
function lhIcon(kind) {
  if (kind === "phone") return `<svg viewBox="0 0 24 24"><path fill="#000" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`;
  if (kind === "mail") return `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><rect x="3" y="5.5" width="18" height="13" rx="1"/><path d="m3.5 6 8.5 7 8.5-7M3.5 18l6.5-6M20.5 18 14 12"/></svg>`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>`;

function normSearch(s) {
  return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
}
function hlText(text, tokens) {
  let out = esc(text == null ? "" : String(text));
  if (!tokens.length) return out;
  const parts = tokens.filter(t => t.length > 0).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!parts.length) return out;
  try { return out.replace(new RegExp("(" + parts.join("|") + ")", "gi"), "<mark>$1</mark>"); } catch (e) { return out; }
}

function globalSearchResults(q) {
  const tokens = normSearch(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const match = hay => { const h = normSearch(hay); return tokens.every(t => h.includes(t)); };
  const cust = id => customerById(id);
  const custHay = c => c ? [c.name, c.company, c.city, c.email].join(" ") : "";
  const groups = [];

  const customers = DB.customers.filter(c => match([c.name, c.company, c.street, c.zip, c.city, c.email, c.phone, c.note,
    ...(c.contacts || []).map(k => [k.name, k.role, k.email, k.phone].join(" "))].join(" ")));
  if (customers.length) groups.push({ title: "Kunden", items: customers.map(c => ({
    nav: ["customer-detail", c.id], title: c.company ? `${c.company}` : c.name,
    sub: [c.company ? c.name : "", [c.zip, c.city].filter(Boolean).join(" "), c.email].filter(Boolean).join(" · "),
  })) });

  const invs = DB.invoices.filter(i => match([i.number, i.type === "lieferschein" ? "lieferschein" : "rechnung", custHay(cust(i.customerId)),
    fmtDate(i.date), i.deliveryRef, i.deliveryTerm, (i.items || []).map(it => it.description).join(" "), fmtCurrency(invoiceTotal(i))].join(" ")))
    .sort((a, b) => b.date.localeCompare(a.date));
  if (invs.length) groups.push({ title: "Rechnungen & Lieferscheine", items: invs.map(i => ({
    nav: ["invoice-detail", i.id], title: `${i.type === "lieferschein" ? "Lieferschein" : "Rechnung"} ${i.number}`,
    sub: `${customerName(cust(i.customerId))} · ${fmtDate(i.date)}`, right: i.type === "lieferschein" ? "" : fmtCurrency(invoiceTotal(i)),
    badge: isOverdue(i) ? "überfällig" : (invoiceStatusMap(i.type)[i.status] || {}).label,
  })) });

  const ords = (DB.orders || []).filter(o => match([o.number, custHay(cust(o.customerId)), o.note, o.title, fmtDate(o.date),
    (o.items || []).map(it => it.description).join(" ")].join(" "))).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  if (ords.length) groups.push({ title: "Aufträge", items: ords.map(o => ({
    nav: ["order-detail", o.id], title: `Auftrag ${o.number}`, sub: `${customerName(cust(o.customerId))} · ${fmtDate(o.date)}`, right: fmtCurrency(orderTotal(o)),
  })) });

  const qts = (DB.quotes || []).filter(o => match([o.number, custHay(cust(o.customerId)), o.note, fmtDate(o.date),
    (o.items || []).map(it => it.description).join(" ")].join(" "))).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  if (qts.length) groups.push({ title: "Angebote", items: qts.map(o => ({
    nav: ["quote-detail", o.id], title: `Angebot ${o.number}`, sub: `${customerName(cust(o.customerId))} · ${fmtDate(o.date)}`, right: fmtCurrency(quoteTotal(o)),
  })) });

  const prods = DB.products.filter(p => match([p.name, p.unit].join(" ")));
  if (prods.length) groups.push({ title: "Artikel", items: prods.map(p => ({
    product: p.id, title: p.name, sub: p.unit || "", right: fmtCurrency(p.price),
  })) });

  const stock = (DB.stockItems || []).filter(s => match([s.name, s.note, s.storageLocation, s.productionLocation, s.dimensions].join(" ")));
  if (stock.length) groups.push({ title: "Lagerartikel", items: stock.map(s => ({
    nav: ["stock-detail", s.id], title: s.name, sub: [s.storageLocation, `Bestand ${s.stock} ${s.unit || ""}`].filter(Boolean).join(" · "),
  })) });

  const mats = (DB.materials || []).filter(s => match([s.name, s.note, s.storageLocation, s.supplier].join(" ")));
  if (mats.length) groups.push({ title: "Material", items: mats.map(s => ({
    nav: ["material-detail", s.id], title: s.name, sub: [s.supplier, `Bestand ${s.stock} ${s.unit || ""}`].filter(Boolean).join(" · "),
  })) });

  return groups;
}

function renderSearch() {
  const q = VIEW.globalQ || "";
  const tokens = normSearch(q).split(/\s+/).filter(Boolean);
  const groups = globalSearchResults(q);
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  return `
  <div class="page-head"><div><h1>Suche</h1><div class="sub">Kunden, Rechnungen, Lieferscheine, Aufträge, Angebote, Artikel, Lager &amp; Material</div></div></div>
  <div class="toolbar">
    <div class="search-box gs-box">${iconSearch()}<input type="search" id="globalSearchPage" placeholder="Suchbegriff, z. B. Name, Rechnungsnr., Ort, Artikel…" value="${esc(q)}" autocomplete="off"></div>
  </div>
  ${!tokens.length ? `<div class="card"><p style="font-size:13px;color:var(--ink-faint);margin:0;">Tipp: Mehrere Wörter grenzen die Suche ein (z. B. <i>Braunlage Schild</i>). Tastenkürzel: <span class="kbd">Strg</span> + <span class="kbd">K</span> oder <span class="kbd">/</span></p></div>` :
    !total ? `<div class="card"><p style="font-size:13px;margin:0;">Nichts gefunden für „${esc(q)}“.</p></div>` :
    groups.map(g => `
      <div class="card gs-group" style="padding:0;">
        <div class="gs-head">${esc(g.title)} <span>${g.items.length}</span></div>
        ${g.items.slice(0, VIEW.gsAll === g.title ? 500 : 15).map(it => `
          <div class="gs-item" ${it.product ? `data-edit-product="${it.product}"` : `data-gs-nav="${it.nav[0]}" data-gs-id="${it.nav[1]}"`}>
            <div class="gs-main"><b>${hlText(it.title, tokens)}</b><span>${hlText(it.sub, tokens)}</span></div>
            ${it.badge ? `<span class="gs-badge">${esc(it.badge)}</span>` : ""}
            ${it.right ? `<span class="mono gs-right">${esc(it.right)}</span>` : ""}
          </div>`).join("")}
        ${g.items.length > 15 && VIEW.gsAll !== g.title ? `<div class="gs-more" data-gs-all="${esc(g.title)}">Alle ${g.items.length} anzeigen</div>` : ""}
      </div>`).join("")}
  `;
}

const DUNNING_DEFAULTS = [
  { name: "Zahlungserinnerung", fee: 0, days: 7 },
  { name: "1. Mahnung", fee: 2.5, days: 7 },
  { name: "2. Mahnung", fee: 5, days: 7 },
];
function dunningLevels() {
  const d = (DB.settings.dunning && Array.isArray(DB.settings.dunning.levels)) ? DB.settings.dunning.levels : DUNNING_DEFAULTS;
  return DUNNING_DEFAULTS.map((def, i) => Object.assign({}, def, d[i] || {}));
}
function invDunning(inv) { return Array.isArray(inv.dunning) ? inv.dunning : []; }
function dunningLevel(inv) { return invDunning(inv).reduce((m, d) => Math.max(m, Number(d.level) || 0), 0); }
function dunningFees(inv, uptoIdx) {
  const list = invDunning(inv);
  const end = uptoIdx === undefined ? list.length : uptoIdx + 1;
  return list.slice(0, end).reduce((s, d) => s + (Number(d.fee) || 0), 0);
}
function daysBetween(aISO, bISO) {
  return Math.round((new Date(bISO + "T00:00:00") - new Date(aISO + "T00:00:00")) / 86400000);
}
function dunningLevelName(level) {
  const l = dunningLevels()[level - 1];
  return l ? l.name : `${level}. Stufe`;
}

function renderDunning() {
  const today = todayISO();
  const overdue = DB.invoices.filter(isOverdue).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const soon = DB.invoices.filter(i => i.type !== "lieferschein" && i.status === "offen" && i.dueDate && i.dueDate >= today && i.dueDate <= addDaysISO(today, 7))
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const sum = overdue.reduce((s, i) => s + invoiceTotal(i) + dunningFees(i), 0);
  const inDunning = overdue.filter(i => dunningLevel(i) > 0).length;
  const oldest = overdue.length ? daysBetween(overdue[0].dueDate, today) : 0;
  const levels = dunningLevels();
  const history = DB.invoices.filter(i => invDunning(i).length && !isOverdue(i)).sort((a, b) => (b.dunning[b.dunning.length - 1].date || "").localeCompare(a.dunning[a.dunning.length - 1].date || "")).slice(0, 20);

  return `
  <div class="page-head"><div><h1>Mahnwesen</h1><div class="sub">Überfällige Rechnungen, Zahlungserinnerungen &amp; Mahnungen</div></div></div>
  <div class="kpi-row">
    <div class="kpi-card"><div class="label">Überfällig</div><div class="value">${overdue.length}</div><div class="delta">Rechnungen</div></div>
    <div class="kpi-card"><div class="label">Offener Betrag</div><div class="value mono">${fmtCurrency(sum)}</div><div class="delta">inkl. Mahngebühren</div></div>
    <div class="kpi-card"><div class="label">Bereits gemahnt</div><div class="value">${inDunning}</div><div class="delta">von ${overdue.length}</div></div>
    <div class="kpi-card"><div class="label">Ältester Rückstand</div><div class="value">${oldest}</div><div class="delta">Tage überfällig</div></div>
  </div>

  <div class="card" style="padding:0;">
    <div class="gs-head" style="border-radius:var(--radius) var(--radius) 0 0;">Überfällige Rechnungen <span>${overdue.length}</span></div>
    <table>
      <thead><tr><th>Nr.</th><th>Kunde</th><th>Fällig seit</th><th class="num">Betrag</th><th>Stand</th><th></th></tr></thead>
      <tbody>
      ${overdue.length ? overdue.map(i => {
        const lvl = dunningLevel(i);
        const last = invDunning(i)[invDunning(i).length - 1];
        const nextDue = last && last.dueDate;
        const waiting = nextDue && nextDue >= today;
        return `
        <tr>
          <td class="mono"><a href="#" data-goto-invoice="${i.id}" style="color:var(--ink);font-weight:600;">${esc(i.number)}</a></td>
          <td data-label="Kunde">${esc(customerName(customerById(i.customerId)))}</td>
          <td data-label="Fällig seit">${fmtDate(i.dueDate)} <span class="dun-days">${daysBetween(i.dueDate, today)} T.</span></td>
          <td class="num" data-label="Betrag">${fmtCurrency(invoiceTotal(i) + dunningFees(i))}</td>
          <td data-label="Stand">${lvl ? `<span class="dun-level l${lvl}">${esc(dunningLevelName(lvl))}</span><div class="dun-meta">am ${fmtDate(last.date)}${nextDue ? ` · Frist ${fmtDate(nextDue)}${waiting ? "" : " abgelaufen"}` : ""}</div>` : `<span class="dun-level l0">noch nicht gemahnt</span>`}</td>
          <td class="dun-actions">
            ${lvl ? `<button class="btn btn-sm" data-dunning-letter="${i.id}">${iconPrint()} Schreiben</button>` : ""}
            ${lvl < levels.length ? `<button class="btn btn-sm ${waiting ? "" : "btn-primary"}" data-dunning-new="${i.id}">${iconPlus()} ${esc(levels[lvl].name)}</button>` : ""}
            <button class="btn btn-sm btn-ghost" data-dunning-paid="${i.id}" title="Als bezahlt markieren">✓ Bezahlt</button>
          </td>
        </tr>`; }).join("") : `<tr class="empty-row"><td colspan="6">Keine überfälligen Rechnungen 🎉</td></tr>`}
      </tbody>
    </table>
  </div>

  ${soon.length ? `
  <div class="card" style="padding:0;">
    <div class="gs-head" style="border-radius:var(--radius) var(--radius) 0 0;">In den nächsten 7 Tagen fällig <span>${soon.length}</span></div>
    <table><tbody>
      ${soon.map(i => `<tr class="clickable" data-goto-invoice="${i.id}"><td class="mono"><b>${esc(i.number)}</b></td><td>${esc(customerName(customerById(i.customerId)))}</td><td>fällig ${fmtDate(i.dueDate)}</td><td class="num">${fmtCurrency(invoiceTotal(i))}</td></tr>`).join("")}
    </tbody></table>
  </div>` : ""}

  ${history.length ? `
  <div class="card" style="padding:0;">
    <div class="gs-head" style="border-radius:var(--radius) var(--radius) 0 0;">Erledigte Mahnvorgänge</div>
    <table><tbody>
      ${history.map(i => `<tr class="clickable" data-goto-invoice="${i.id}"><td class="mono"><b>${esc(i.number)}</b></td><td>${esc(customerName(customerById(i.customerId)))}</td><td>${esc(dunningLevelName(dunningLevel(i)))}</td><td>${(invoiceStatusMap(i.type)[i.status] || {}).label || esc(i.status)}</td></tr>`).join("")}
    </tbody></table>
  </div>` : ""}
  `;
}

function openDunningModal(invId) {
  const inv = invoiceById(invId);
  if (!inv) return;
  const lvl = dunningLevel(inv) + 1;
  const levels = dunningLevels();
  if (lvl > levels.length) { showToast("Letzte Mahnstufe ist bereits erreicht"); return; }
  const def = levels[lvl - 1];
  const today = todayISO();
  openModal(`
    <h2>${esc(def.name)} – Rechnung ${esc(inv.number)}</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px;">${esc(customerName(customerById(inv.customerId)))} · Rechnungsbetrag ${fmtCurrency(invoiceTotal(inv))} · fällig seit ${fmtDate(inv.dueDate)}</p>
    <form id="dunningForm">
      <div class="form-grid">
        <div class="field"><label>Datum des Schreibens</label><input type="date" id="dun_date" value="${today}"></div>
        <div class="field"><label>Neue Zahlungsfrist</label><input type="date" id="dun_due" value="${addDaysISO(today, Number(def.days) || 7)}"></div>
        <div class="field"><label>Mahngebühr (€)</label><input type="number" step="0.01" min="0" id="dun_fee" value="${Number(def.fee) || 0}"></div>
      </div>
      <div class="hint">Bisherige Mahngebühren: ${fmtCurrency(dunningFees(inv))}. Standardwerte unter Einstellungen → Mahnwesen.</div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnCancelModal">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Erstellen &amp; Schreiben öffnen</button>
      </div>
    </form>
  `);
  document.getElementById("btnCancelModal").onclick = closeModal;
  document.getElementById("dunningForm").onsubmit = async (e) => {
    e.preventDefault();
    const entry = {
      level: lvl,
      date: document.getElementById("dun_date").value || today,
      dueDate: document.getElementById("dun_due").value || addDaysISO(today, 7),
      fee: Math.max(0, Number(document.getElementById("dun_fee").value) || 0),
      by: CURRENT_USER ? CURRENT_USER.name : "",
    };
    if (!Array.isArray(inv.dunning)) inv.dunning = [];
    inv.dunning.push(entry);
    inv.reminderSentAt = entry.date;
    await saveData();
    closeModal();
    VIEW.dunIdx = inv.dunning.length - 1;
    go("dunning-letter", inv.id);
  };
}

function dunningTexts(level, inv, entry, prev, totalAll) {
  const base = `unsere Rechnung Nr. ${esc(inv.number)} vom ${fmtDate(inv.date)} war am ${fmtDate(inv.dueDate)} zur Zahlung fällig.`;
  if (level <= 1) return [
    `sicher ist es Ihrer Aufmerksamkeit entgangen: ${base} Bis heute konnten wir leider keinen Zahlungseingang feststellen.`,
    `Wir bitten Sie, den offenen Betrag von <b>${fmtCurrency(totalAll)}</b> bis zum <b>${fmtDate(entry.dueDate)}</b> auf das unten genannte Konto zu überweisen.`,
    `Sollten Sie die Zahlung bereits veranlasst haben, betrachten Sie dieses Schreiben bitte als gegenstandslos.`,
  ];
  if (level === 2) return [
    `${base[0].toUpperCase() + base.slice(1)} Trotz unserer ${prev ? `${esc(dunningLevelName(prev.level))} vom ${fmtDate(prev.date)}` : "Zahlungserinnerung"} ist der Betrag bislang nicht bei uns eingegangen.`,
    `Bitte überweisen Sie den Gesamtbetrag von <b>${fmtCurrency(totalAll)}</b> bis spätestens <b>${fmtDate(entry.dueDate)}</b> auf das unten genannte Konto.`,
    `Falls es Gründe für die Verzögerung gibt oder Unklarheiten zur Rechnung bestehen, melden Sie sich bitte kurz bei uns.`,
  ];
  return [
    `${base[0].toUpperCase() + base.slice(1)} Leider haben Sie auch auf unsere ${prev ? `${esc(dunningLevelName(prev.level))} vom ${fmtDate(prev.date)}` : "bisherigen Schreiben"} nicht reagiert.`,
    `Wir fordern Sie hiermit letztmalig auf, den Gesamtbetrag von <b>${fmtCurrency(totalAll)}</b> bis spätestens <b>${fmtDate(entry.dueDate)}</b> zu begleichen.`,
    `Sollte der Betrag bis dahin nicht bei uns eingegangen sein, behalten wir uns weitere Schritte vor, ohne Sie erneut zu benachrichtigen.`,
  ];
}

  const inv = invoiceById(id);
  if (!inv || !invDunning(inv).length) return `<div class="card">Kein Mahnschreiben gefunden. <span class="back-link" data-nav="dunning">${iconArrowLeft()} Zurück</span></div>`;

    <div class="head-actions">

      <button class="btn" data-goto-invoice="${inv.id}">${iconDoc()} Rechnung</button>
      <button class="btn" id="btnPrintDunning">${iconPrint()} Drucken / PDF</button>
      <button class="btn" data-mail-dunning="${inv.id}" data-dun-idx="${idx}">${iconMail()} E-Mail vorbereiten</button>
      ${isAdmin() ? `<button class="btn btn-danger" data-dunning-delete="${inv.id}" data-dun-idx="${idx}" title="Dieses Mahnschreiben löschen">${iconTrash()}</button>` : ""}
    </div>
  </div>

  <div class="invoice-sheet" id="invoiceSheet" style="${letterheadSheetStyle()}">
    ${renderLetterhead()}
    <div class="invoice-body">
      <div class="invoice-return-line">${esc(comp.name)} · ${esc(comp.street)} · ${esc(comp.zip)} ${esc(comp.city)}</div>
      <div class="invoice-addr-block">
        <div class="addr">
          <b>${esc(c ? c.name : "Unbekannter Kunde")}</b><br>
          ${c && c.company ? esc(c.company) + "<br>" : ""}
          ${c ? esc(c.street) : ""}<br>
          ${c ? esc(c.zip) + " " + esc(c.city) : ""}
        </div>
      </div>
      <div class="invoice-meta">
        <h1>${esc(title)}</h1>
        <div class="date">Datum: ${fmtDate(entry.date)}</div>
        <div class="date">zu Rechnung Nr. ${esc(inv.number)}</div>
      </div>
      <div class="invoice-header-spacer"></div>

      <div class="dun-letter-text">
        <p>${greet}</p>
        ${texts.map(t => `<p>${t}</p>`).join("")}
      </div>

      <table class="invoice-items" style="margin-top:18px;">
        <thead><tr><th>Rechnung</th><th>Rechnungsdatum</th><th>Fällig seit</th><th class="num" style="width:22%">Betrag</th></tr></thead>
        <tbody>
          <tr><td>${esc(inv.number)}</td><td>${fmtDate(inv.date)}</td><td>${fmtDate(inv.dueDate)}</td><td class="num">${fmtCurrency(invTotal)}</td></tr>
          ${fees > 0 ? `<tr><td colspan="3">Mahngebühren</td><td class="num">${fmtCurrency(fees)}</td></tr>` : ""}
          <tr class="total-row"><td colspan="3" style="text-align:right">Offener Gesamtbetrag</td><td class="num">${fmtCurrency(totalAll)}</td></tr>
        </tbody>
      </table>
      ${comp.kleinunternehmer ? `<div class="invoice-vat-note">MwSt. wird nicht ausgewiesen (Kleinunternehmer, §19 UStG)</div>` : ""}

      <div class="invoice-pay-row">
        <div class="invoice-footnote">
          Bitte geben Sie als Verwendungszweck <b>Rechnung ${esc(inv.number)}</b> an.<br><br>
          Mit freundlichen Grüßen<br>${esc(comp.owners || comp.name || "")}<br>${esc(comp.brand || "")}
        </div>
        ${qrSvg ? `<div class="invoice-qr">${qrSvg}<div class="invoice-qr-caption">Mit Banking-App<br>scannen &amp; bezahlen</div></div>` : ""}
      </div>
    </div>
  </div>`;
}

function buildDunningMailto(inv, idx) {
  const c = customerById(inv.customerId);
  if (!c || !c.email) return null;
  const comp = DB.settings.company;
  const entry = invDunning(inv)[idx];
  if (!entry) return null;
  const totalAll = invoiceTotal(inv) + dunningFees(inv, idx);
  const name = dunningLevelName(entry.level);
  const subject = `${name}: Rechnung ${inv.number} – ${comp.brand || comp.name}`;
  let body;
  if (entry.level <= 1) {
    body = `Hallo,\n\nwir wollten kurz nachfragen, ob unsere Rechnung ${inv.number} vom ${fmtDate(inv.date)} (fällig am ${fmtDate(inv.dueDate)}) vielleicht bei Ihnen untergegangen ist.\n\nWir bitten um Überweisung von ${fmtCurrency(totalAll)} bis zum ${fmtDate(entry.dueDate)}. Falls Sie den Betrag bereits überwiesen haben, betrachten Sie diese Nachricht bitte als gegenstandslos.`;
  } else {
    body = `Sehr geehrte Damen und Herren,\n\nanbei erhalten Sie unsere ${name} zur Rechnung ${inv.number} vom ${fmtDate(inv.date)}. Der offene Gesamtbetrag beträgt ${fmtCurrency(totalAll)}${dunningFees(inv, idx) > 0 ? ` (inkl. ${fmtCurrency(dunningFees(inv, idx))} Mahngebühren)` : ""}.\n\nBitte überweisen Sie den Betrag bis spätestens ${fmtDate(entry.dueDate)}.`;
  }
  body += `\n\nBankverbindung:\n${comp.bankName || ""}\nKontoinhaber: ${comp.accountHolder || comp.owners || ""}\nIBAN: ${comp.iban || ""}\nBIC: ${comp.bic || ""}\nVerwendungszweck: Rechnung ${inv.number}\n\nHinweis: Das PDF ist dieser E-Mail noch nicht angehängt – bitte zuerst über "Drucken / PDF" speichern und hier manuell anhängen.\n\nMit freundlichen Grüßen\n${mailSignatureBlock()}`;
  return `mailto:${c.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function renderInvoiceDunningCard(inv) {
  if (inv.type === "lieferschein") return "";
  const list = invDunning(inv);
  if (!list.length) return "";
  return `
  <div class="card no-print">
    <h3 style="margin-bottom:8px;">Mahnverlauf</h3>
    <table><tbody>
      ${list.map((d, i) => `<tr class="clickable" data-dunning-letter="${inv.id}" data-dun-idx="${i}">
        <td><b>${esc(dunningLevelName(d.level))}</b></td><td>${fmtDate(d.date)}${d.by ? " · " + esc(d.by) : ""}</td>
        <td>Frist ${fmtDate(d.dueDate)}</td><td class="num">${Number(d.fee) ? "+" + fmtCurrency(d.fee) : ""}</td></tr>`).join("")}
    </tbody></table>
  </div>`;
}

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n > 1048576) return (n / 1048576).toFixed(1).replace(".", ",") + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}
const BACKUP_REASONS = { auto: "automatisch", manual: "manuell", "before-restore": "vor Wiederherstellung", initial: "vor Sicherheits-Update" };

function auditActionLabel(a) {
  return ({ save: "gespeichert", "save-force": "gespeichert (überschrieben)", users: "Benutzer geändert", backup: "Backup erstellt", restore: "Backup wiederhergestellt" })[a] || a;
}
function renderAuditDetails(e) {
  const d = e.details;
  if (e.action === "restore") return `Stand vom ${fmtDateTime(d && d.backup_from)} wiederhergestellt`;
  if (e.action === "backup") return d && d.note ? esc(d.note) : "";
  if (e.action === "users") return Array.isArray(d) ? d.map(x => `${esc(x.user)}: ${esc(x.action)}`).join("<br>") : "";
  if (!Array.isArray(d)) return "";
  return d.map(x => `<div class="audit-line"><span class="audit-a a-${esc(x.a || "")}">${esc(x.a || "")}</span> ${esc(x.t || "")}${x.f && x.f.length ? `<div class="audit-f">${x.f.map(esc).join(" · ")}</div>` : ""}</div>`).join("");
}

        </tbody>

      ${list.length && list.length % 100 === 0 ? `<div class="head-actions" style="justify-content:center;margin-top:10px;"><button class="btn btn-sm" id="btnAuditMore">Ältere laden</button></div>` : ""}
    ` : `<button type="button" class="btn btn-sm" id="btnLoadAudit">Protokoll anzeigen</button>`}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ============================================================
   Zusätzliche Event-Verdrahtung (wird bei jedem Render aufgerufen)
   ============================================================ */

function attachExtraHandlers() {
  // --- Globale Suche ---
  const sideSearch = document.getElementById("sidebarSearch");
  if (sideSearch) {
    sideSearch.oninput = () => {
      VIEW.globalQ = sideSearch.value; VIEW.gsAll = null;
      if (VIEW.tab !== "search") {
        go("search");
        const s2 = document.getElementById("sidebarSearch");
        if (s2) { s2.focus(); const l = s2.value.length; try { s2.setSelectionRange(l, l); } catch (e) {} }
      } else renderInPlace();
    };
    sideSearch.onkeydown = (e) => { if (e.key === "Enter") { VIEW.globalQ = sideSearch.value; go("search"); } };
  }
  const pageSearch = document.getElementById("globalSearchPage");
  if (pageSearch) {
    pageSearch.oninput = () => { VIEW.globalQ = pageSearch.value; VIEW.gsAll = null; renderInPlace(); const s = document.getElementById("sidebarSearch"); if (s) s.value = VIEW.globalQ; };
    if (VIEW.tab === "search" && document.activeElement !== sideSearch) {
      pageSearch.focus();
      const l = pageSearch.value.length; try { pageSearch.setSelectionRange(l, l); } catch (e) {}
    }
  }
  document.querySelectorAll("[data-gs-nav]").forEach(el => el.addEventListener("click", () => go(el.dataset.gsNav, el.dataset.gsId)));
  document.querySelectorAll("[data-gs-all]").forEach(el => el.addEventListener("click", () => { VIEW.gsAll = el.dataset.gsAll; renderInPlace(); }));
  document.querySelectorAll(".gs-item[data-edit-product]").forEach(el => el.addEventListener("click", () => openProductModal(el.dataset.editProduct)));

  // --- Mahnwesen ---
  document.querySelectorAll("[data-dunning-new]").forEach(el => el.addEventListener("click", (e) => { e.stopPropagation(); openDunningModal(el.dataset.dunningNew); }));
  document.querySelectorAll("[data-dunning-letter]").forEach(el => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const inv = invoiceById(el.dataset.dunningLetter);
    VIEW.dunIdx = el.dataset.dunIdx != null ? Number(el.dataset.dunIdx) : (inv ? invDunning(inv).length - 1 : 0);
    go("dunning-letter", el.dataset.dunningLetter);
  }));
  document.querySelectorAll("[data-dunning-paid]").forEach(el => el.addEventListener("click", async (e) => {
    e.stopPropagation();
    const inv = invoiceById(el.dataset.dunningPaid);
    if (!inv) return;
    if (!confirm(`Rechnung ${inv.number} als bezahlt markieren?`)) return;
    inv.status = "bezahlt";
    await saveData();
    render();
  }));
  const dunIdxSelect = document.getElementById("dunIdxSelect");
  if (dunIdxSelect) dunIdxSelect.onchange = () => { VIEW.dunIdx = Number(dunIdxSelect.value); render(); };
  const btnPrintDunning = document.getElementById("btnPrintDunning");
  if (btnPrintDunning) btnPrintDunning.onclick = () => window.print();
  document.querySelectorAll("[data-mail-dunning]").forEach(el => el.addEventListener("click", () => {
    const inv = invoiceById(el.dataset.mailDunning);
    if (!inv) return;
    const m = buildDunningMailto(inv, Number(el.dataset.dunIdx));
    if (!m) { showToast("Bitte zuerst eine E-Mail-Adresse beim Kunden hinterlegen."); return; }
    window.location.href = m;
  }));
  document.querySelectorAll("[data-dunning-delete]").forEach(el => el.addEventListener("click", async () => {
    if (!isAdmin()) return;
    const inv = invoiceById(el.dataset.dunningDelete);
    const idx = Number(el.dataset.dunIdx);
    if (!inv || !invDunning(inv)[idx]) return;
    if (!confirm(`${dunningLevelName(inv.dunning[idx].level)} vom ${fmtDate(inv.dunning[idx].date)} wirklich löschen?`)) return;
    inv.dunning.splice(idx, 1);
    inv.reminderSentAt = inv.dunning.length ? inv.dunning[inv.dunning.length - 1].date : inv.reminderSentAt;
    await saveData();
    if (inv.dunning.length) { VIEW.dunIdx = inv.dunning.length - 1; render(); } else go("dunning");
  }));

  // --- Einstellungen: Mahnwesen ---
  const btnSaveDun = document.getElementById("btnSaveDunningSettings");
  if (btnSaveDun) btnSaveDun.onclick = async () => {
    if (!isAdmin()) return;
    const levels = dunningLevels().map((l, i) => ({
      name: (document.querySelector(`.dun-set-name[data-i="${i}"]`).value || l.name).trim(),
      fee: Math.max(0, Number(document.querySelector(`.dun-set-fee[data-i="${i}"]`).value) || 0),
      days: Math.max(1, Number(document.querySelector(`.dun-set-days[data-i="${i}"]`).value) || 7),
    }));
    DB.settings.dunning = { levels };
    await saveData();
    render();
  };

  // --- Einstellungen: Briefpapier ---
  document.querySelectorAll('input[name="lhMode"]').forEach(r => r.addEventListener("change", async () => {
    if (!isAdmin()) return;
    DB.settings.letterheadMode = r.value === "image" ? "image" : "vector";
    await saveData();
    render();
  }));

  // --- Einstellungen: Benutzer (serverseitig) ---
  const btnAddUser = document.getElementById("btnAddUser");
  if (btnAddUser) btnAddUser.onclick = () => {
    const tbody = document.getElementById("usersBody");
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><input type="text" class="user-name" value=""></td>
      <td><input type="password" class="user-pin" value="" placeholder="PIN (Pflicht)" autocomplete="new-password"></td>
      <td><select class="user-role"><option value="user" selected>Benutzer</option><option value="admin">Admin</option></select></td>
      <td><button type="button" class="btn btn-sm btn-ghost user-remove">${iconTrash()}</button></td>`;
    tbody.appendChild(row);
    row.querySelector(".user-remove").addEventListener("click", () => row.remove());
    row.querySelector(".user-name").focus();
  };
  document.querySelectorAll(".user-remove").forEach(btn => { btn.onclick = () => btn.closest("tr").remove(); });
  const btnSaveUsers = document.getElementById("btnSaveUsers");
  if (btnSaveUsers) btnSaveUsers.onclick = async () => {
    if (!isAdmin()) return;
    const rows = Array.from(document.querySelectorAll("#usersBody tr"));
    const users = rows.map(r => ({
      name: r.querySelector(".user-name").value.trim(),
      original_name: r.dataset.originalName || null,
      pin: r.querySelector(".user-pin").value.trim(),
      role: r.querySelector(".user-role").value,
    })).filter(u => u.name);
    if (!users.length) { showToast("Mindestens ein Benutzer wird benötigt"); return; }
    if (!users.some(u => u.role === "admin")) { showToast("Mindestens ein Admin wird benötigt"); return; }
    const missing = users.find(u => !u.original_name && !u.pin);
    if (missing) { showToast(`Bitte eine PIN für ${missing.name} vergeben`); return; }
    const short = users.find(u => u.pin && u.pin.length < 4);
    if (short) { showToast("PINs müssen mindestens 4 Zeichen lang sein"); return; }
    try {
      const pub = await rpc("crm_save_users", { p_token: SESSION_TOKEN, p_users: users });
      DB.settings.users = pub;
      const me = users.find(u => u.original_name === CURRENT_USER.name);
      if (me) CURRENT_USER = { name: me.name, role: me.role };
      USER_NAMES = pub.map(u => u.name);
      ADMIN_USERS = await rpc("crm_get_users", { p_token: SESSION_TOKEN });
      if (BASE_JSON) { const b = JSON.parse(BASE_JSON); if (b.settings) { b.settings.users = pub; BASE_JSON = JSON.stringify(b); } }
      showToast("Benutzer gespeichert");
      render();
    } catch (e) {
      if (!e.sessionInvalid) showToast("⚠ " + (e.message || "Speichern fehlgeschlagen").replace(/^.*?: /, ""));
    }
  };

  // --- Einstellungen: Backups ---
  const btnLoadBackups = document.getElementById("btnLoadBackups");
  if (btnLoadBackups) btnLoadBackups.onclick = async () => {
    try { ADMIN_BACKUPS = await rpc("crm_list_backups", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY }); renderInPlace(); }
    catch (e) { if (!e.sessionInvalid) showToast("⚠ Backups konnten nicht geladen werden"); }
  };
  const btnCreateBackup = document.getElementById("btnCreateBackup");
  if (btnCreateBackup) btnCreateBackup.onclick = async () => {
    const note = prompt("Notiz zum Backup (optional):", "");
    if (note === null) return;
    try {
      await SAVE_CHAIN;
      await rpc("crm_create_backup", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY, p_note: note || null });
      ADMIN_BACKUPS = await rpc("crm_list_backups", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY });
      showToast("Backup erstellt");
      renderInPlace();
    } catch (e) { if (!e.sessionInvalid) showToast("⚠ Backup fehlgeschlagen"); }
  };
  const btnDownloadCurrent = document.getElementById("btnDownloadCurrent");
  if (btnDownloadCurrent) btnDownloadCurrent.onclick = () => downloadJson(cleanForSave(DB), `freakywood-crm-${todayISO()}.json`);
  document.querySelectorAll("[data-backup-download]").forEach(el => el.addEventListener("click", async () => {
    try {
      const v = await rpc("crm_get_backup", { p_token: SESSION_TOKEN, p_id: Number(el.dataset.backupDownload) });
      downloadJson(v, `freakywood-crm-backup-${el.dataset.backupDownload}.json`);
    } catch (e) { if (!e.sessionInvalid) showToast("⚠ Download fehlgeschlagen"); }
  }));
  document.querySelectorAll("[data-backup-restore]").forEach(el => el.addEventListener("click", async () => {
    if (!isAdmin()) return;
    if (!confirm(`Datenstand vom ${el.dataset.backupTime} wiederherstellen?\n\nAlle Änderungen danach werden zurückgesetzt. Der aktuelle Stand wird vorher automatisch als Backup gesichert.`)) return;
    try {
      await SAVE_CHAIN;
      await rpc("crm_restore_backup", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY, p_id: Number(el.dataset.backupRestore) });
      await loadData();
      ADMIN_BACKUPS = await rpc("crm_list_backups", { p_token: SESSION_TOKEN, p_key: STORAGE_KEY });
      ADMIN_AUDIT = null;
      showToast("Backup wiederhergestellt");
      render();
    } catch (e) { if (!e.sessionInvalid) showToast("⚠ Wiederherstellen fehlgeschlagen: " + e.message); }
  }));

  // --- Einstellungen: Protokoll ---
  const btnLoadAudit = document.getElementById("btnLoadAudit");
  if (btnLoadAudit) btnLoadAudit.onclick = async () => {
    try { ADMIN_AUDIT = await rpc("crm_list_audit", { p_token: SESSION_TOKEN, p_limit: 100, p_before: null }); renderInPlace(); }
    catch (e) { if (!e.sessionInvalid) showToast("⚠ Protokoll konnte nicht geladen werden"); }
  };
  const btnAuditMore = document.getElementById("btnAuditMore");
  if (btnAuditMore) btnAuditMore.onclick = async () => {
    const last = ADMIN_AUDIT[ADMIN_AUDIT.length - 1];
    try {
      const more = await rpc("crm_list_audit", { p_token: SESSION_TOKEN, p_limit: 100, p_before: last.id });
      ADMIN_AUDIT = ADMIN_AUDIT.concat(more || []);
      renderInPlace();
    } catch (e) {}
  };
  const auditSearch = document.getElementById("auditSearch");
  if (auditSearch) auditSearch.oninput = () => { VIEW.auditQ = auditSearch.value; renderInPlace(); };
}

// Beim Öffnen der Einstellungen die Benutzerliste vom Server holen (für Sperr-Hinweise)
async function refreshAdminUsers() {
  if (!isAdmin() || !SESSION_TOKEN) return;
  try {
    const u = await rpc("crm_get_users", { p_token: SESSION_TOKEN });
    const changed = JSON.stringify(u) !== JSON.stringify(ADMIN_USERS);
    ADMIN_USERS = u;
    if (changed && VIEW.tab === "settings" && !document.querySelector("#usersBody input:focus")) renderInPlace();
  } catch (e) {}
}

// Tastenkürzel: Strg/Cmd+K oder "/" öffnet die Suche
function installGlobalKeys() {
  document.addEventListener("keydown", (e) => {
    if (!APP_UNLOCKED) return;
    const tag = (e.target && e.target.tagName) || "";
    const typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable);
    if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go("search"); }
    else if (e.key === "/" && !typing) { e.preventDefault(); go("search"); }
  });
}

async function boot() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px;text-align:center;color:#141414;font-family:Georgia,serif;">Lade FreakyWood CRM…</div>`;
  await loadUserNames();
  render();
}

installGlobalKeys();
boot();
