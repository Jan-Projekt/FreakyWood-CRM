<title>FreakyWood CRM</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --paper:#FAFAFA;
  --panel:#FFFFFF;
  --panel-2:#F5F5F5;
  --ink:#141414;
  --ink-soft:#525252;
  --ink-faint:#8F8F8F;
  --line:#E5E5E5;
  --line-soft:#EFEFEF;
  --amber:#141414;
  --amber-dark:#000000;
  --amber-tint:#F0F0F0;
  --rust:#C0392B;
  --rust-tint:#FCEDEB;
  --sage:#2E7D4F;
  --sage-tint:#E9F5EE;
  --gold:#8F8F8F;
  --shadow: 0 1px 2px rgba(20,20,20,0.04), 0 1px 1px rgba(20,20,20,0.03);
  --shadow-lg: 0 16px 40px rgba(20,20,20,0.10), 0 4px 10px rgba(20,20,20,0.05);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --grain: var(--ink);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Work Sans', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'IBM Plex Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  letter-spacing:-0.006em;
}
#app{
  display:flex;
  min-height:100vh;
  min-height:100dvh;
}
@keyframes viewIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.main > *{animation:viewIn .28s cubic-bezier(.22,.61,.36,1) both;}
@media (prefers-reduced-motion: reduce){
  .main > *{animation:none;}
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:232px;
  flex-shrink:0;
  background:linear-gradient(180deg,#161616 0%, #000000 100%);
  color:#FFFFFF;
  display:flex;
  flex-direction:column;
  padding:26px 18px 18px;
}
.brand{
  display:flex;
  flex-direction:column;
  margin-bottom:30px;
  padding-left:2px;
}
.brand .brand-logo{
  width:132px;
  height:auto;
  display:block;
}
.brand-tag{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8A8A8A;
  margin-top:3px;
}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  color:#B0B0B0;
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  border:1px solid transparent;
  transition:background .15s ease, color .15s ease;
  user-select:none;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#FFFFFF;}
.nav-item.active{background:rgba(255,255,255,.14);color:#FFFFFF;}
.nav-item.active svg{opacity:1;}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;
  color:#7A7A7A;
}
.user-badge{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:10px;font-size:12.5px;color:#D4D4D4;font-weight:600;
}
.logout-link{
  background:transparent;border:1px solid rgba(255,255,255,.16);color:#9A9A9A;
  font-size:10.5px;padding:3px 9px;border-radius:var(--radius-sm);cursor:pointer;
  transition:color .15s ease, border-color .15s ease;
}
.logout-link:hover{color:#FFFFFF;border-color:rgba(255,255,255,.35);}
.mt-logout{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  background:transparent;border:1px solid rgba(255,255,255,.16);color:#D4D4D4;
  font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:var(--radius-sm);
}
.new-invoice-btn{
  margin-top:20px;
  background:#FFFFFF;
  color:#111111;
  border:none;
  padding:11px 14px;
  border-radius:var(--radius-sm);
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  transition:transform .1s ease, opacity .15s ease;
}
.new-invoice-btn:hover{opacity:.88;}
.new-invoice-btn:active{transform:scale(0.97);}

/* ---------- Main ---------- */
.main{
  flex:1;
  min-width:0;
  padding:32px 36px 60px;
  max-width:1180px;
}
.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:28px;
  gap:16px;
  flex-wrap:wrap;
  position:relative;
}
.page-head h1{
  font-family:var(--font-display);
  font-size:28px;
  font-weight:600;
  margin:0 0 5px;
  color:var(--ink);
  letter-spacing:-0.01em;
}
.page-head .sub{color:var(--ink-faint);font-size:13.5px;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  font-family:var(--font-body);
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  padding:8px 14px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .08s ease, opacity .15s ease;
}
.btn:hover{background:var(--panel-2);border-color:var(--ink-faint);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#FFFFFF;box-shadow:0 1px 2px rgba(20,20,20,.15);}
.btn-primary:hover{background:#000000;border-color:#000000;}
.btn-danger{color:var(--rust);border-color:var(--line);background:transparent;}
.btn-danger:hover{background:var(--rust-tint);border-color:var(--rust);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--panel-2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.kpi-card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
  transition:box-shadow .2s cubic-bezier(.22,.61,.36,1), transform .2s cubic-bezier(.22,.61,.36,1);
}
.kpi-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:600;margin-bottom:10px;}
.kpi-card .value{font-family:var(--font-display);font-size:26px;color:var(--ink);letter-spacing:-0.01em;}
.kpi-card .value.mono{font-family:var(--font-mono);}
.kpi-card .delta{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.kpi-card.kpi-clickable{cursor:pointer;}
.kpi-card.kpi-clickable:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.kpi-card.kpi-clickable:active{transform:translateY(0px) scale(0.99);}

.legend-list li.clickable-row{cursor:pointer;border-radius:6px;transition:background .1s ease;}
.legend-list li.clickable-row:hover{background:var(--panel-2);padding-left:6px;padding-right:6px;margin:0 -6px;}

/* Cards / panels */
.card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:24px 26px;
  margin-bottom:20px;
}
.card h2{font-family:var(--font-display);font-size:17px;margin:0 0 16px;font-weight:600;letter-spacing:-0.005em;}
.card h3{font-family:var(--font-display);font-size:15px;margin:0 0 10px;font-weight:600;color:var(--ink-soft);}
.grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:start;}

/* Tables */
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--ink-faint);
  font-weight:700;
  padding:0 12px 10px;
  border-bottom:1px solid var(--line);
}
td{
  padding:13px 12px;
  border-bottom:1px solid var(--line-soft);
  font-size:13.5px;
  vertical-align:middle;
}
tr:last-child td{border-bottom:none;}
tr.clickable{cursor:pointer;transition:background .12s ease;}
tr.clickable:hover td{background:var(--panel-2);}
td.num, th.num{text-align:right;font-family:var(--font-mono);}
td.mono{font-family:var(--font-mono);}
.empty-row td{color:var(--ink-faint);text-align:center;padding:30px 0;font-style:italic;}

/* Status badge — clean modern pill */
.stamp{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-family:var(--font-body);
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
  padding:4px 11px;
  border-radius:99px;
}
.stamp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.stamp.offen{color:var(--ink-soft);background:var(--panel-2);}
.stamp.inbearbeitung{color:var(--ink);background:#fff;border:1px solid var(--line);}
.stamp.abgerechnet{color:#fff;background:var(--ink);}
.stamp.bezahlt{color:var(--sage);background:var(--sage-tint);}
.stamp.storniert{color:var(--rust);background:var(--rust-tint);}
.stamp.ueberfaellig{color:#fff;background:var(--rust);font-weight:700;}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field .hint{font-size:11px;color:var(--ink-faint);}
input[type=text], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea{
  font-family:var(--font-body);
  font-size:13.5px;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:#fff;
  color:var(--ink);
  width:100%;
  transition:border-color .15s ease, box-shadow .15s ease;
}
textarea{resize:vertical;min-height:56px;font-family:var(--font-body);}
input:focus, select:focus, textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,20,20,.08);}
.checkbox-row{display:flex;align-items:center;gap:8px;}

/* Line items editor */
.items-table th, .items-table td{padding:7px 8px;}
.items-table input{padding:6px 8px;font-size:13px;}
.items-table .desc-col{width:42%;}
.items-table .num-col{width:12%;}
.items-total-row td{border-top:2px solid var(--ink);font-weight:700;font-family:var(--font-mono);}
.items-table .col-delivered{display:none;}
.items-table.mode-lieferschein .col-price{display:none;}
.items-table.mode-lieferschein .col-delivered{display:table-cell;}

/* Search bar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px;}
.search-box input{padding-left:30px;}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.5;}
.filter-select{max-width:180px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,15,15,.55);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
  backdrop-filter:blur(2px);
}
.modal{
  background:var(--panel);
  border-radius:var(--radius-lg);
  max-width:520px;width:100%;
  max-height:90vh;overflow-y:auto;
  padding:28px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);
  animation:modalIn .18s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);} to{opacity:1;transform:translateY(0) scale(1);}}
.modal h2{font-family:var(--font-display);font-size:18px;margin:0 0 16px;letter-spacing:-0.005em;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#FFFFFF;padding:11px 20px;border-radius:99px;
  font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* Breadcrumb / link back */
.back-link{display:inline-flex;align-items:center;gap:5px;color:var(--ink-faint);font-size:12.5px;cursor:pointer;margin-bottom:12px;font-weight:600;transition:color .15s ease;}
.back-link:hover{color:var(--ink);}

/* Product / customer chip */
.chip{display:inline-block;background:var(--panel-2);color:var(--ink-soft);border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:600;}

/* Invoice print styling — echtes Briefpapier als Hintergrund-Layer,
   Rechnungsdaten werden nur noch darüber platziert.
   Bewusst einfach gehalten: feste mm-Maße (identisch auf Bildschirm und
   beim Drucken), kein aspect-ratio, kein Flexbox-Prozent-Mix - das hat
   sich als zu fragil erwiesen. Absender-Adresse per position:absolute
   fest an die Ecke unter dem Logo gesetzt. */
.invoice-sheet{
  position:relative;
  width:210mm;
  min-height:297mm;
  margin:0 auto;
  background-size:210mm 297mm;
  background-repeat:no-repeat;
  background-position:top left;
  background-color:#fff;
  color:#000000;
  border:1px solid var(--line-soft);
  box-shadow:var(--shadow-lg);
  border-radius:8px;
  overflow:visible;
  font-family: Arial, Helvetica, sans-serif;
  box-sizing:border-box;
}
.invoice-body{position:relative;padding:20mm 18mm 55mm;box-sizing:border-box;}

/* Anschriftfeld nach DIN 5008 (Form A), exakt positioniert für Fensterbriefumschläge:
   Feld gesamt 27–72mm ab Blattoberkante, 20–105mm ab linker Blattkante.
   Obere Zone (27–44,7mm): Rücksendeangabe. Untere Zone (44,7–72mm): Anschrift.
   Rechnungs-Kopfdaten stehen daneben (ab 125mm), damit nichts mit dem Sichtfenster kollidiert. */
.invoice-return-line{
  position:absolute;
  top:27mm;left:25mm;width:75mm;
  font-size:7.5px;color:#4A4A4A;
  padding-bottom:2px;
  border-bottom:1px solid #B0B0B0;
}
.invoice-addr-block{
  position:absolute;
  top:44.7mm;left:25mm;width:75mm;
}
.invoice-addr-block .addr{font-size:13.5px;line-height:1.5;}
.invoice-meta{
  position:absolute;
  top:36mm;left:125mm;width:65mm;
}
.invoice-meta h1{font-size:16px;margin:0 0 5px;letter-spacing:.02em;}
.invoice-meta .date{font-size:11.5px;color:#4A4A4A;line-height:1.5;}
.invoice-header-spacer{height:62mm;}
.invoice-terms{margin-top:16px;font-size:12px;color:#4A4A4A;}
.invoice-items{margin-top:42px;width:100%;border-collapse:collapse;}
.invoice-items th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:#8A8A8A;border-bottom:1.5px solid #141414;padding:0 8px 8px;
}
.invoice-items td{padding:9px 8px;border-bottom:1px solid #ECECEC;font-size:13px;}
.invoice-items th.num, .invoice-items td.num{text-align:right;font-variant-numeric:tabular-nums;}
.invoice-items tr.total-row td{border-top:2px solid #141414;border-bottom:none;font-weight:700;font-size:14px;}
.invoice-vat-note{text-align:right;font-size:11px;color:#8A8A8A;margin-top:4px;font-style:italic;}
.invoice-footnote{margin-top:26px;font-size:12.5px;color:#1A1A1A;line-height:1.6;}

/* Lieferschein layout */
.ls-title{font-size:22px;font-weight:700;text-align:center;margin:6px 0 14px;}
.ls-companyline{font-size:11px;color:#4A4A4A;text-align:center;}
.ls-hr{border:none;border-top:1px solid #141414;margin:10px 0 18px;}
.ls-header-row{display:flex;gap:20px;align-items:stretch;margin-bottom:18px;}
.ls-addr-box{
  display:flex;border:1px solid #141414;flex:1;min-height:80px;
}
.ls-vert-label{
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:8px 5px;border-right:1px solid #141414;
  display:flex;align-items:center;justify-content:center;
  white-space:nowrap;
}
.ls-addr-content{padding:10px 14px;font-size:13px;line-height:1.5;}
.ls-meta-box{font-size:12px;line-height:1.9;white-space:nowrap;}
.ls-meta-box b{display:inline-block;min-width:66px;}
.ls-kunde{font-size:13px;line-height:1.6;margin-bottom:16px;}
.ls-fields{font-size:12.5px;line-height:1.7;margin-bottom:20px;}
.ls-items{margin-top:0;}
.ls-packstuecke{font-weight:700;font-size:12.5px;margin-top:14px;}
.ls-note{
  margin-top:26px;border:1px solid #141414;padding:12px 16px;
  font-size:11.5px;font-weight:700;text-align:center;line-height:1.5;
}

@page{
  size: A4;
  margin: 0;
}
@media print{
  .sidebar, .page-head .head-actions, .no-print, .toolbar, #toast, .bottom-nav, .fab, .mobile-topbar{display:none !important;}
  .main{padding:0;max-width:100%;}
  body{background:#fff;}
  #app{display:block;}

  /* Gleiche feste 210x297mm wie am Bildschirm — dadurch keine
     Umrechnung nötig, das Bild sitzt exakt gleich wie in der Vorschau. */
  .invoice-sheet{
    border:none;box-shadow:none;border-radius:0;
    margin:0;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }
}

.dash-charts{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

/* Lock screen */
.lock-screen{
  flex:1;
  width:100%;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 20%, #262626 0%, #000000 70%);
  padding:20px;
}
.lock-card{
  background:var(--panel);
  border-radius:var(--radius-lg);
  padding:40px 34px;
  max-width:340px;width:100%;
  text-align:center;
  box-shadow:var(--shadow-lg);
}
@keyframes logoIntro{
  from{opacity:0;transform:scale(.8);}
  to{opacity:1;transform:scale(1);}
}
.lock-logo{
  width:140px;height:auto;margin:0 auto 20px;display:block;
  animation:logoIntro .9s cubic-bezier(.22,.61,.36,1) both;
}
@media (prefers-reduced-motion: reduce){
  .lock-logo{animation:none;}
}
.lock-card h1{font-family:var(--font-display);font-size:20px;margin:0 0 6px;letter-spacing:-0.01em;}
.lock-card p{font-size:13px;color:var(--ink-faint);margin:0 0 20px;}
.lock-card input{text-align:center;letter-spacing:.12em;font-size:16px;padding:13px;border-radius:var(--radius-sm);}
.lock-error{color:var(--rust);font-size:12.5px;min-height:18px;margin-top:8px;}
.legend-list{list-style:none;margin:0;padding:0;}
.legend-list li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.legend-list li:last-child{border-bottom:none;}
.legend-list .rank{color:var(--ink-faint);font-family:var(--font-mono);width:20px;display:inline-block;}

.more-list{display:flex;flex-direction:column;gap:10px;}
.more-item{
  display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:17px 18px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:box-shadow .2s ease, transform .2s ease;
}
.more-item:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.more-item .mi-icon{
  width:42px;height:42px;border-radius:var(--radius-sm);
  background:var(--panel-2);color:var(--ink);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.more-item .mi-icon svg{width:20px;height:20px;}
.more-item .mi-text b{display:block;font-size:14.5px;}
.more-item .mi-text span{font-size:12px;color:var(--ink-faint);}
.more-item .mi-chevron{margin-left:auto;color:var(--ink-faint);}

/* ---------- Mobile top bar & bottom nav (native app shell) ---------- */
.mobile-topbar, .bottom-nav, .fab{display:none;}

@media (max-width: 860px){
  #app{flex-direction:column;}
  .sidebar{display:none;}

  .mobile-topbar{
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:50;
    background:linear-gradient(180deg,#141414 0%, #000000 100%);
    color:#FFFFFF;
    padding:calc(12px + var(--safe-top)) 16px 12px;
  }
  .mobile-topbar .mt-word{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .mobile-topbar .mt-title{
    font-family:var(--font-display);font-size:13px;font-weight:500;
    padding-left:12px;border-left:1px solid rgba(255,255,255,.18);color:#C7C7C7;
  }

  .main{padding:16px 14px calc(96px + var(--safe-bottom));max-width:100%;}
  .form-grid, .kpi-row, .dash-charts, .grid-2{grid-template-columns:1fr;}
  .kpi-row{gap:10px;}
  .page-head{align-items:flex-start;}
  .page-head .head-actions{width:100%;}
  .page-head .head-actions .btn{flex:1;justify-content:center;}

  /* Bottom tab bar */
  .bottom-nav{
    display:flex;
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:60;
    background:linear-gradient(180deg,#161616 0%, #000000 100%);
    padding:6px 6px calc(6px + var(--safe-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,.18);
  }
  .bn-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    color:#8F8F8F;
    font-size:10px;
    font-weight:600;
    border-radius:var(--radius-sm);
    transition:color .15s ease;
  }
  .bn-item svg{width:20px;height:20px;}
  .bn-item.active{color:#FFFFFF;}
  .bn-item.bn-main{
    color:#FFFFFF;
  }
  .bn-item.bn-main .bn-main-circle{
    width:44px;height:44px;border-radius:50%;
    background:#FFFFFF;
    color:#111111;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
    margin-top:-22px;
    border:3px solid #000000;
    transition:transform .12s ease;
  }
  .bn-item.bn-main:active .bn-main-circle{transform:scale(0.92);}
  .bn-item.bn-main .bn-main-circle svg{width:19px;height:19px;}

  /* Floating action button as backup on list screens */
  .fab{
    display:flex;
    position:fixed;
    right:18px;
    bottom:calc(78px + var(--safe-bottom));
    z-index:55;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(0,0,0,.25);
    border:none;
    transition:transform .12s ease;
  }
  .fab svg{width:22px;height:22px;}
  .fab:active{transform:scale(0.92);}

  /* Tables -> stacked cards */
  .card table thead{display:none;}
  .card table, .card table tbody, .card table tr, .card table td{display:block;width:100%;}
  .card table{border:none;}
  .card table tr{
    padding:12px 4px;
    border-bottom:1px solid var(--line-soft);
  }
  .card table tr.empty-row{padding:26px 4px;}
  .card table td{
    border-bottom:none;
    padding:3px 4px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
  }
  .card table td.num{text-align:right;}
  .card table td[data-label]::before{
    content:attr(data-label);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:700;
    flex-shrink:0;
  }
  .card table td:not([data-label])::before{content:none;}
  .card{padding:14px 14px;border-radius:12px;}
  .card h2{font-size:15.5px;}

  /* Modals become bottom sheets */
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal{
    max-width:100%;
    width:100%;
    border-radius:16px 16px 0 0;
    max-height:88vh;
    padding:20px 18px calc(20px + var(--safe-bottom));
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4;} to{transform:translateY(0);opacity:1;}}

  .toolbar{flex-direction:column;align-items:stretch;}
  .search-box{max-width:100%;}
  .filter-select{max-width:100%;}

  .items-table-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px;}
  .items-table{min-width:520px;}

  .invoice-body{overflow-x:auto;}
  .ls-header-row{flex-direction:column;}
  .ls-meta-box{white-space:normal;}
  .invoice-items{font-size:11.5px;min-width:520px;}

  .btn{min-height:40px;}
}

@media (max-width:420px){
  .kpi-row{grid-template-columns:1fr 1fr;}
}
</style>

<script>
/* ============================================================
   FreakyWood CRM — App-Logik
   ============================================================ */

const STORAGE_KEY = "freakywood-crm-data-v1";

let DB = null;           // { customers, products, invoices, settings }
let VIEW = { tab: "dashboard", id: null }; // current view state
let STORAGE_OK = true;
let APP_UNLOCKED = false;
let CURRENT_USER = null; // { name, role: 'admin' | 'user' }

/* ---------------- Storage (Supabase) ---------------- */

function ensureUserDefaults(db) {
  if (!db.settings) return;
  if (!db.settings.users || !Array.isArray(db.settings.users) || db.settings.users.length === 0) {
    db.settings.users = [
      { name: "Wayne", pin: "0109", role: "user" },
      { name: "Jan", pin: "1908", role: "admin" }
    ];
  }
  if (Array.isArray(db.invoices)) {
    db.invoices.forEach(inv => {
      if (!inv.createdBy) inv.createdBy = "Admin";
      if (!inv.type) inv.type = "rechnung";
      if (inv.invoiceId === undefined) inv.invoiceId = null;
      // Lieferscheine nutzten früher denselben Status wie Rechnungen ("bezahlt");
      // seit Einführung von "versendet"/"erledigt" für Lieferscheine migrieren wir das.
      if (inv.type === "lieferschein" && inv.status === "bezahlt") inv.status = "erledigt";
      // Liefer-/Leistungsdatum: für Bestandsrechnungen als sinnvollen Default auf das
      // Rechnungsdatum setzen, damit beim erneuten Drucken kein leeres Feld erscheint.
      if (!inv.performanceDate) inv.performanceDate = inv.date;
    });
  }
  if (db.settings.company && db.settings.company.steuernummer === undefined) {
    db.settings.company.steuernummer = "21/234/10203";
  }
  if (Array.isArray(db.customers)) {
    db.customers.forEach(c => {
      if (!Array.isArray(c.contacts)) c.contacts = [];
    });
  }
  if (!Array.isArray(db.orders)) db.orders = [];
  if (db.settings.orderNextSeq === undefined) db.settings.orderNextSeq = 1;
  if (db.settings.orderSeqYear === undefined) db.settings.orderSeqYear = Number(todayISO().slice(0,4));
  if (!Array.isArray(db.quotes)) db.quotes = [];
  if (db.settings.quoteNextSeq === undefined) db.settings.quoteNextSeq = 1;
  if (db.settings.quoteSeqYear === undefined) db.settings.quoteSeqYear = Number(todayISO().slice(0,4));
  db.quotes.forEach(q => {
    if (q.invoiceId === undefined) q.invoiceId = null;
  });
}

async function loadData() {
  try {
    const { data, error } = await sbClient
      .from('crm_kv')
      .select('value')
      .eq('key', STORAGE_KEY)
      .maybeSingle();

    if (error) {
      // Echter Fehler (Rechte/Netzwerk) — NIEMALS in diesem Fall überschreiben,
      // sonst gehen bestehende Daten verloren. Stattdessen deutlich warnen.
      console.error("Fehler beim Laden aus Supabase:", error);
      DB = JSON.parse(JSON.stringify(SEED_DATA));
      ensureUserDefaults(DB);
      DB.__loadError = error.message || "Verbindung zur Datenbank fehlgeschlagen.";
      return;
    }

    if (data && data.value) {
      DB = data.value;
      ensureUserDefaults(DB);
      return;
    }

    // Kein Fehler, aber wirklich noch keine Zeile vorhanden -> einmaliger Erststart
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    ensureUserDefaults(DB);
    await saveData(true);
  } catch (e) {
    console.error("Verbindung zu Supabase fehlgeschlagen:", e);
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    ensureUserDefaults(DB);
    DB.__loadError = e && e.message ? e.message : "Verbindung zur Datenbank fehlgeschlagen.";
  }
}

async function saveData(silent) {
  try {
    const { error } = await sbClient
      .from('crm_kv')
      .upsert({ key: STORAGE_KEY, value: DB, updated_at: new Date().toISOString() });
    if (error) throw error;
    STORAGE_OK = true;
    if (!silent) showToast("Gespeichert");
  } catch (e) {
    STORAGE_OK = false;
    console.error("Speicherfehler:", e);
    showToast("⚠ Speichern fehlgeschlagen — Änderung ggf. nicht dauerhaft");
  }
}

/* ---------------- Helpers ---------------- */

function uid(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 9);
}

function fmtCurrency(n) {
  n = Number(n) || 0;
  return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}

function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${d}.${m}.${y}`;
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function addDaysISO(iso, days) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function customerById(id) {
  return DB.customers.find(c => c.id === id);
}
function productById(id) {
  return DB.products.find(p => p.id === id);
}
function invoiceById(id) {
  return DB.invoices.find(i => i.id === id);
}
function invoiceTotal(inv) {
  return inv.items.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
}
function orderById(id) {
  return DB.orders.find(o => o.id === id);
}
function orderTotal(order) {
  return order.items.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
}
function quoteById(id) {
  return DB.quotes.find(q => q.id === id);
}
function quoteTotal(quote) {
  return quote.items.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
}
function customerName(c) {
  if (!c) return "Unbekannter Kunde";
  return c.company ? `${c.name} — ${c.company}` : c.name;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function nextInvoiceNumber(dateISO) {
  const year = (dateISO || todayISO()).slice(0, 4);
  const y = Number(year);
  let seq = DB.settings.nextSeq;
  if (DB.settings.seqYear !== y) {
    // new year -> could reset to 1, but keep continuing sequence is safer for bookkeeping continuity;
    // we reset per calendar year to match the observed numbering scheme (YYYY + running number).
    seq = 1;
  }
  return { number: `${y}${String(seq).padStart(3, "0")}`, year: y, seq };
}

function nextOrderNumber(dateISO) {
  const year = (dateISO || todayISO()).slice(0, 4);
  const y = Number(year);
  let seq = DB.settings.orderNextSeq || 1;
  if (DB.settings.orderSeqYear !== y) seq = 1;
  return { number: `A-${y}-${String(seq).padStart(3, "0")}`, year: y, seq };
}

function nextQuoteNumber(dateISO) {
  const year = (dateISO || todayISO()).slice(0, 4);
  const y = Number(year);
  let seq = DB.settings.quoteNextSeq || 1;
  if (DB.settings.quoteSeqYear !== y) seq = 1;
  return { number: `AN-${y}-${String(seq).padStart(3, "0")}`, year: y, seq };
}

/* ---------------- Navigation ---------------- */

function go(tab, id) {
  VIEW = { ...VIEW, tab, id: id || null };
  render();
  window.scrollTo(0, 0);
}

/* ---------------- Shell / Render root ---------------- */

function render() {
  const app = document.getElementById("app");
  const usersConfigured = DB.settings.users && DB.settings.users.length > 0;
  if (usersConfigured && (!APP_UNLOCKED || !CURRENT_USER)) {
    app.innerHTML = renderLockScreen();
    wireLockScreen();
    return;
  }
  app.innerHTML = `
    ${renderSidebar()}
    ${renderMobileTopbar()}
    <div class="main">${DB.__loadError ? renderConnectionError() : ""}${renderMain()}</div>
    ${renderBottomNav()}
    ${renderFab()}
  `;
  attachGlobalHandlers();
  runPostRenderHooks();
}

function renderConnectionError() {
  return `
  <div class="card" style="border-left:4px solid var(--rust);background:var(--rust-tint);">
    <h2 style="color:var(--rust);margin-bottom:6px;">Keine Verbindung zur Datenbank</h2>
    <p style="font-size:13px;margin:0;">Deine echten Daten konnten nicht geladen werden (Grund: <span class="mono">${esc(DB.__loadError)}</span>). Du siehst gerade nur Beispieldaten. <b>Bitte hier nichts eintragen</b>, sonst geht es verloren — lade die Seite neu, sobald die Verbindung wieder steht, oder prüfe die Supabase-Berechtigungen.</p>
  </div>`;
}

function isAdmin() {
  return !!(CURRENT_USER && CURRENT_USER.role === "admin");
}

function renderLockScreen() {
  const users = DB.settings.users || [];
  return `
  <div class="lock-screen">
    <div class="lock-card">
      <img src="${LOGO_BANNER}" alt="FreakyWood" class="lock-logo">
      <h1>Wer bist du?</h1>
      <p>Name wählen und PIN eingeben.</p>
      <form id="lockForm">
        <div class="field" style="text-align:left;">
          <label>Name</label>
          <select id="lockUser">
            ${users.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join("")}
          </select>
        </div>
        <input type="password" inputmode="text" id="lockInput" placeholder="PIN" autofocus autocomplete="off">
        <div id="lockError" class="lock-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px;">Anmelden</button>
      </form>
    </div>
  </div>`;
}

function wireLockScreen() {
  const form = document.getElementById("lockForm");
  const input = document.getElementById("lockInput");
  const userSelect = document.getElementById("lockUser");
  input.focus();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const chosen = (DB.settings.users || []).find(u => u.name === userSelect.value);
    if (chosen && input.value === chosen.pin) {
      APP_UNLOCKED = true;
      CURRENT_USER = { name: chosen.name, role: chosen.role || "user" };
      render();
    } else {
      document.getElementById("lockError").textContent = "Falscher PIN. Bitte erneut versuchen.";
      input.value = "";
      input.focus();
    }
  });
}

function renderDashboard() {
  const years = Array.from(new Set(DB.invoices.map(i => i.date.slice(0, 4)))).sort();
  const selYear = VIEW.dashYear || years[years.length - 1] || String(new Date().getFullYear());
  const invs = DB.invoices.filter(i => i.date.slice(0, 4) === selYear && i.status !== "storniert" && (i.type||"rechnung") === "rechnung");

  const totalRevenue = invs.reduce((s, i) => s + invoiceTotal(i), 0);
  const openAmount = invs.filter(i => i.status === "offen").reduce((s, i) => s + invoiceTotal(i), 0);

  // revenue by month
  const monthNames = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const byMonth = new Array(12).fill(0);
  invs.forEach(i => { byMonth[Number(i.date.slice(5,7)) - 1] += invoiceTotal(i); });

  // top customers
  const custRevenue = {};
  invs.forEach(i => { custRevenue[i.customerId] = (custRevenue[i.customerId] || 0) + invoiceTotal(i); });
  const topCustomers = Object.entries(custRevenue).sort((a,b) => b[1]-a[1]).slice(0,6);

  // top products
  const prodStats = {};
  invs.forEach(i => i.items.forEach(it => {
    const key = it.description;
    if (!prodStats[key]) prodStats[key] = { qty: 0, revenue: 0 };
    prodStats[key].qty += Number(it.qty) || 0;
    prodStats[key].revenue += (Number(it.qty)||0) * (Number(it.price)||0);
  }));
  const topProducts = Object.entries(prodStats).sort((a,b) => b[1].revenue - a[1].revenue).slice(0,8);

  // overdue (unabhängig vom Jahresfilter — bezieht sich immer auf heute)
  const overdueInvs = DB.invoices.filter(isOverdue);
  const overdueAmount = overdueInvs.reduce((s,i)=>s+invoiceTotal(i),0);

  // Aufträge, die gerade aktiv laufen (unabhängig vom Jahresfilter)
  const activeOrders = DB.orders
    .filter(o => o.status === "offen" || o.status === "in_bearbeitung")
    .sort((a,b) => a.date.localeCompare(b.date));
  const inProgressCount = DB.orders.filter(o => o.status === "in_bearbeitung").length;

  return `
  <div class="page-head">
    <div>
      <h1>Auswertungen</h1>
      <div class="sub">Umsatz- und Kundenübersicht für ${esc(DB.settings.company.brand)}</div>
    </div>
    <div class="head-actions">
      <select class="filter-select" id="dashYearSelect">
        ${years.map(y => `<option value="${y}" ${y===selYear?"selected":""}>${y}</option>`).join("")}
      </select>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="label">Umsatz ${esc(selYear)}</div><div class="value mono">${fmtCurrency(totalRevenue)}</div></div>
    <div class="kpi-card kpi-clickable" data-nav="invoices"><div class="label">Rechnungen</div><div class="value mono">${invs.length}</div></div>
    <div class="kpi-card kpi-clickable" data-nav="invoices" data-invoice-status-filter="offen"><div class="label">Offene Forderungen</div><div class="value mono">${fmtCurrency(openAmount)}</div>${overdueInvs.length ? `<div class="delta" style="color:var(--rust);font-weight:600;">${overdueInvs.length} überfällig · ${fmtCurrency(overdueAmount)}</div>` : ""}</div>
    <div class="kpi-card kpi-clickable" data-nav="orders" data-order-status-filter="in_bearbeitung"><div class="label">Aufträge in Bearbeitung</div><div class="value mono">${inProgressCount}</div></div>
  </div>

  <div class="card">
    <h2>Aktuelle Aufträge</h2>
    <table>
      <thead><tr><th>Nr.</th><th>Kunde</th><th>Datum</th><th class="num">Betrag (geschätzt)</th><th>Status</th></tr></thead>
      <tbody>
        ${activeOrders.length ? activeOrders.map(o => `
          <tr class="clickable" data-goto-order="${o.id}">
            <td class="mono"><b>${esc(o.number)}</b></td>
            <td>${esc(customerName(customerById(o.customerId)))}</td>
            <td>${fmtDate(o.date)}</td>
            <td class="num">${fmtCurrency(orderTotal(o))}</td>
            <td>${orderStatusBadge(o.status)}</td>
          </tr>`).join("") : `<tr class="empty-row"><td colspan="5">Aktuell keine offenen oder laufenden Aufträge</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="dash-charts">
    <div class="card">
      <h2>Umsatz pro Monat</h2>
      <div id="monthChartWrap" style="position:relative;height:230px;">
        <canvas id="monthChart" data-values='${JSON.stringify(byMonth)}' data-labels='${JSON.stringify(monthNames)}'></canvas>
      </div>
    </div>
    <div class="card">
      <h2>Top Kunden</h2>
      <ul class="legend-list">
        ${topCustomers.length ? topCustomers.map(([cid, rev], idx) => `
          <li class="clickable-row" data-goto-customer="${cid}"><span><span class="rank">${idx+1}.</span>${esc(customerName(customerById(cid)))}</span><span class="mono">${fmtCurrency(rev)}</span></li>
        `).join("") : `<li style="color:var(--ink-faint)">Keine Daten für dieses Jahr</li>`}
      </ul>
    </div>
  </div>

  <div class="card">
    <h2>Meistverkaufte Artikel</h2>
    <table>
      <thead><tr><th>Artikel</th><th class="num">Menge</th><th class="num">Umsatz</th></tr></thead>
      <tbody>
        ${topProducts.length ? topProducts.map(([desc, s]) => `
          <tr class="clickable" data-nav="products"><td>${esc(desc)}</td><td class="num">${s.qty}</td><td class="num">${fmtCurrency(s.revenue)}</td></tr>
        `).join("") : `<tr class="empty-row"><td colspan="3">Keine Artikeldaten für dieses Jahr</td></tr>`}
      </tbody>
    </table>
  </div>
  `;
}

function drawMonthChart() {
  const canvas = document.getElementById("monthChart");
  if (!canvas) return;
  if (typeof Chart === "undefined") {
    const wrap = document.getElementById("monthChartWrap");
    if (wrap) wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:12.5px;text-align:center;padding:0 20px;">Diagramm-Bibliothek konnte nicht geladen werden (evtl. Adblocker oder keine Internetverbindung). Zahlen unten sind trotzdem korrekt.</div>`;
    return;
  }
  const values = JSON.parse(canvas.dataset.values);
  const labels = JSON.parse(canvas.dataset.labels);
  if (canvas._chart) canvas._chart.destroy();
  canvas._chart = new Chart(canvas.getContext("2d"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: "#141414",
        borderRadius: 4,
        maxBarThickness: 34,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: (ctx) => fmtCurrency(ctx.parsed.y)
      } } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: (v) => v + " €" }, grid: { color: "#ECECEC" } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderCustomerDetail(id) {
  const c = customerById(id);
  if (!c) return `<div class="card">Kunde nicht gefunden. <span class="back-link" data-nav="customers">${iconArrowLeft()} Zurück</span></div>`;
  const invs = DB.invoices.filter(i => i.customerId === id).sort((a,b) => b.date.localeCompare(a.date));
  const invsForRevenue = invs.filter(i => (i.type||"rechnung") === "rechnung");
  const revenue = invsForRevenue.reduce((s,i) => s + invoiceTotal(i), 0);
  const openAmt = invsForRevenue.filter(i=>i.status==="offen").reduce((s,i)=>s+invoiceTotal(i),0);

  const artStats = {};
  invsForRevenue.forEach(i => i.items.forEach(it => {
    if (!artStats[it.description]) artStats[it.description] = { qty:0, revenue:0, last:"" };

function isOverdue(inv) {
  return inv.type !== "lieferschein" && inv.status === "offen" && !!inv.dueDate && inv.dueDate < todayISO();
}

const RECHNUNG_STATUSES = {
  offen: { label: "Offen", cls: "offen" },
  bezahlt: { label: "Bezahlt", cls: "bezahlt" },
  storniert: { label: "Storniert", cls: "storniert" },
};
const LIEFERSCHEIN_STATUSES = {
  offen: { label: "Offen", cls: "offen" },
  versendet: { label: "Versendet", cls: "inbearbeitung" },
  erledigt: { label: "Erledigt", cls: "bezahlt" },
  storniert: { label: "Storniert", cls: "storniert" },
};
function invoiceStatusMap(type) {
  return type === "lieferschein" ? LIEFERSCHEIN_STATUSES : RECHNUNG_STATUSES;
}
function invoiceStatusOptionsHtml(type, currentStatus) {
  const map = invoiceStatusMap(type);
  const keys = Object.keys(map);
  const selectedKey = map[currentStatus] ? currentStatus : keys[0];
  return keys.map(k => `<option value="${k}" ${k===selectedKey?"selected":""}>${esc(map[k].label)}</option>`).join("");
}
function statusStamp(inv) {
  if (isOverdue(inv)) {
    return `<span class="stamp ueberfaellig">Überfällig</span>`;
  }
  const map = invoiceStatusMap(inv.type);
  const s = map[inv.status] || { label: inv.status, cls: "offen" };
  return `<span class="stamp ${s.cls}">${esc(s.label)}</span>`;
}

const ORDER_STATUSES = {
  offen: { label: "Offen", cls: "offen" },
  in_bearbeitung: { label: "In Bearbeitung", cls: "inbearbeitung" },
  erledigt: { label: "Erledigt", cls: "bezahlt" },
  abgerechnet: { label: "Abgerechnet", cls: "abgerechnet" },
};
function orderStatusBadge(status) {
  const s = ORDER_STATUSES[status] || { label: status, cls: "offen" };
  return `<span class="stamp ${s.cls}">${esc(s.label)}</span>`;
}

const QUOTE_STATUSES = {
  offen: { label: "Offen", cls: "offen" },
  angenommen: { label: "Angenommen", cls: "bezahlt" },
  abgelehnt: { label: "Abgelehnt", cls: "storniert" },
  umgewandelt: { label: "Umgewandelt", cls: "abgerechnet" },
};
function quoteStatusBadge(status) {
  const s = QUOTE_STATUSES[status] || { label: status, cls: "offen" };
  return `<span class="stamp ${s.cls}">${esc(s.label)}</span>`;
}

function renderLieferscheinBody(inv, c, comp) {
  const addrLines = c ? `${esc(c.name)}${c.company?"<br>"+esc(c.company):""}<br>${esc(c.street)}<br>${esc(c.zip)} ${esc(c.city)}` : "Unbekannter Kunde";
  return `
  <div class="invoice-body ls-body">
    <div class="ls-title">Lieferschein</div>
    <div class="ls-companyline">${esc(comp.name)} • ${esc(comp.street)} • ${esc(comp.zip)}-${esc(comp.city)}</div>
    <hr class="ls-hr">

    <div class="ls-header-row">
      <div class="ls-addr-box">
        <div class="ls-vert-label">Lieferanschrift</div>
        <div class="ls-addr-content">${addrLines}</div>
      </div>
      <div class="ls-meta-box">
        <div><b>Datum.</b> : ${fmtDate(inv.date)}</div>
        <div><b>Beleg-Nr.</b> : ${esc(inv.number)}</div>
        <div><b>Bearbeiter</b> : ${esc(inv.bearbeiter || "—")}</div>
        <div><b>Telefon</b> : ${esc(comp.phone)}</div>
      </div>
    </div>

    <div class="ls-kunde">
      <b>Kunde:</b><br>
      ${addrLines}
    </div>

    <div class="ls-fields">
      <div>Angebots-Nr. &nbsp;&nbsp;: ${esc(inv.angebotsNr || "/")}</div>
      <div>Lieferbedingung &nbsp;&nbsp;: ${esc(inv.deliveryTerm || "—")}</div>
      <div>Lieferung &nbsp;&nbsp;: ${esc(inv.lieferungArt || "—")}</div>
      <div>Versandart &nbsp;&nbsp;: ${esc(inv.versandart || "—")}</div>
    </div>

    <table class="invoice-items ls-items">
      <thead><tr>
        <th style="width:6%">POS.</th>
        <th>Beschreibung</th>
        <th class="num" style="width:16%">Auftragsmenge</th>
        <th class="num" style="width:14%">Liefermenge</th>
        <th class="num" style="width:14%">Restmenge</th>
      </tr></thead>
      <tbody>
        ${inv.items.map((it, idx) => {
          const ordered = Number(it.qty) || 0;
          const delivered = it.deliveredQty !== undefined ? Number(it.deliveredQty) || 0 : ordered;
          const rest = Math.max(0, ordered - delivered);
          return `
          <tr>
            <td>${idx+1}</td>
            <td>${esc(it.description)}</td>
            <td class="num">${ordered}</td>
            <td class="num">${delivered}</td>
            <td class="num">${rest} ST</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>

    <div class="ls-packstuecke">Anzahl Packstücke: ${inv.packstuecke || 1}</div>

    <div class="invoice-footnote">Wenn Du Fragen zu diesem Lieferschein haben solltest, wende Dich bitte an folgende E-Mail-Adresse : ${esc(comp.email)}</div>

    <div class="ls-note">**Bitte beachte, dass nur saubere, intakte und verkaufsfertige Ware zurück genommen werden kann. Angefertigte Produkte sind von der Rücknahme ausgeschlossen.</div>
  </div>`;
}

function paymentFootnote(inv) {
  const c = DB.settings.company;
  if (inv.paymentMethod === "bar") {
    return "Vielen Dank für deine Bestellung! Rechnungsbetrag in Bar erhalten.";
  }
  if (inv.status === "bezahlt") {
    return "Vielen Dank für deine Bestellung! Der Rechnungsbetrag ist beglichen.";
  }
  if (inv.dueDate) {
    return `Vielen Dank für deine Bestellung!<br>Bitte überweise den Rechnungsbetrag bis zum ${fmtDate(inv.dueDate)} ohne Abzüge auf das unten aufgeführte Konto.`;
  }
  return "Vielen Dank für deine Bestellung!<br>Bitte überweise den Rechnungsbetrag ohne Abzüge auf das unten aufgeführte Konto.";
}

function renderInvoiceDetail(id) {
  const inv = invoiceById(id);
  if (!inv) return `<div class="card">Dokument nicht gefunden. <span class="back-link" data-nav="invoices">${iconArrowLeft()} Zurück</span></div>`;
  const c = customerById(inv.customerId);
  const comp = DB.settings.company;
  const total = invoiceTotal(inv);
  const isLieferschein = inv.type === "lieferschein";
  const docLabel = isLieferschein ? "Lieferschein" : "Rechnung";
  const linkedInvoice = isLieferschein && inv.invoiceId ? invoiceById(inv.invoiceId) : null;

  return `
  <span class="back-link no-print" data-nav="invoices">${iconArrowLeft()} Alle Rechnungen</span>
  <div class="page-head no-print">
    <div><h1>${docLabel} ${esc(inv.number)}</h1><div class="sub">${esc(customerName(c))} · ${fmtDate(inv.date)} · erstellt von ${esc(inv.createdBy || "—")}</div></div>
    <div class="head-actions">
      <select id="statusChanger" data-invoice-id="${inv.id}" class="btn" style="font-family:inherit;">
        ${invoiceStatusOptionsHtml(inv.type, inv.status)}
      </select>
      <button class="btn" data-nav="invoice-edit" data-nav-id="${inv.id}">${iconEdit()} Bearbeiten</button>
      <button class="btn" id="btnPrintInvoice">${iconPrint()} Drucken / PDF</button>
      <button class="btn btn-danger" data-delete-invoice="${inv.id}">${iconTrash()}</button>
    </div>
  </div>

  ${isLieferschein ? (linkedInvoice ? `
    <div class="card no-print" style="border-left:3px solid var(--ink);">
      <p style="font-size:13px;margin:0;">Bereits abgerechnet als Rechnung <a href="#" data-goto-invoice="${linkedInvoice.id}" style="font-weight:600;color:var(--ink);">${esc(linkedInvoice.number)}</a>.</p>
    </div>
  ` : `
    <div class="card no-print" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <p style="font-size:13px;color:var(--ink-soft);margin:0;">Wenn der Lieferschein abgerechnet werden soll, kannst du daraus direkt eine Rechnung erstellen.</p>
      <button class="btn btn-primary" data-convert-lieferschein="${inv.id}">${iconDoc()} Rechnung erstellen</button>
    </div>
  `) : ""}

  <div class="invoice-sheet" id="invoiceSheet" style="background-image:url('${LETTERHEAD_BG}');">
    ${isLieferschein ? renderLieferscheinBody(inv, c, comp) : `
    <div class="invoice-body">
      <div class="invoice-return-line">${esc(comp.name)} · ${esc(comp.street)} · ${esc(comp.zip)} ${esc(comp.city)}</div>

      <div class="invoice-addr-block">
        <div class="addr">
          <b>${esc(c ? c.name : "Unbekannter Kunde")}</b><br>
          ${c && c.company ? esc(c.company)+"<br>" : ""}
          ${c ? esc(c.street) : ""}<br>
          ${c ? esc(c.zip)+" "+esc(c.city) : ""}
        </div>
      </div>

      <div class="invoice-meta">
        <h1>Rechnung Nr. ${esc(inv.number)}</h1>
        <div class="date">Rechnungsdatum: ${fmtDate(inv.date)}</div>
        <div class="date">Liefer-/Leistungsdatum: ${fmtDate(inv.performanceDate || inv.date)}</div>
      </div>

      <div class="invoice-header-spacer"></div>

      ${(inv.deliveryTerm || inv.deliveryRef) ? `<div class="invoice-terms">
        ${inv.deliveryTerm ? `Lieferbedingung&nbsp;&nbsp;${esc(inv.deliveryTerm)}<br>` : ""}
        ${inv.deliveryRef ? esc(inv.deliveryRef) : ""}
      </div>` : ""}

      <table class="invoice-items">
        <thead><tr><th style="width:6%">POS</th><th>Beschreibung</th><th class="num" style="width:14%">Anzahl</th><th class="num" style="width:14%">Preis</th><th class="num" style="width:16%">Summe</th></tr></thead>
        <tbody>
          ${inv.items.map((it, idx) => `
            <tr>
              <td>${idx+1}</td>
              <td>${esc(it.description)}</td>
              <td class="num">${it.qty}</td>
              <td class="num">${fmtCurrency(it.price)}</td>
              <td class="num">${fmtCurrency((Number(it.qty)||0)*(Number(it.price)||0))}</td>
            </tr>`).join("")}
          <tr class="total-row"><td colspan="4" style="text-align:right">Endsumme</td><td class="num">${fmtCurrency(total)}</td></tr>
        </tbody>
      </table>
      ${comp.kleinunternehmer ? `<div class="invoice-vat-note">MwSt. wird nicht ausgewiesen (Kleinunternehmer, §19 UStG)</div>` : ""}
      <div class="invoice-footnote">${paymentFootnote(inv)}</div>
    </div>
    `}
  </div>
  `;
}

function renderInvoiceForm(editId) {
  const editing = editId ? invoiceById(editId) : null;
  const isEdit = !!editing;
  const prefillOrder = (!isEdit && VIEW.prefillOrder) ? orderById(VIEW.prefillOrder) : null;
  const prefillQuoteSrc = (!isEdit && VIEW.prefillQuoteToInvoice) ? quoteById(VIEW.prefillQuoteToInvoice) : null;
  const prefillLieferschein = (!isEdit && VIEW.prefillLieferschein) ? invoiceById(VIEW.prefillLieferschein) : null;
  const prefillSrc = prefillOrder || prefillQuoteSrc || prefillLieferschein;
  const prefillCustomer = VIEW.prefillCustomer || (prefillSrc ? prefillSrc.customerId : (editing ? editing.customerId : ""));

  const date = editing ? editing.date : todayISO();
  const numberInfo = editing ? { number: editing.number } : nextInvoiceNumber(date);
  const dueDate = editing ? editing.dueDate : addDaysISO(date, DB.settings.company.defaultPaymentDays || 14);
  const performanceDate = editing ? (editing.performanceDate || editing.date) : date;
  const items = editing ? editing.items
    : prefillLieferschein ? prefillLieferschein.items.map(it => ({ description: it.description, qty: (it.deliveredQty !== undefined && it.deliveredQty !== null ? it.deliveredQty : it.qty), price: it.price }))
    : prefillSrc ? prefillSrc.items.map(it => ({...it}))
    : [{ description: "", qty: 1, price: 0 }];
  const prefillDeliveryRef = prefillOrder ? `Gemäß Auftrag ${prefillOrder.number}`
    : prefillQuoteSrc ? `Gemäß Angebot ${prefillQuoteSrc.number}`
    : prefillLieferschein ? `Gemäß Lieferschein ${prefillLieferschein.number}`
    : "";

  const customerOptions = DB.customers.slice().sort((a,b)=>a.name.localeCompare(b.name,"de"))
    .map(c => `<option value="${c.id}" ${(prefillCustomer===c.id)?"selected":""}>${esc(customerName(c))}</option>`).join("");

  const productDatalist = DB.products.map(p => `<option data-price="${p.price}" value="${esc(p.name)}">`).join("");

  const docType = editing ? (editing.type || "rechnung") : (VIEW.prefillDocType || "rechnung");

  return `
  <span class="back-link no-print" data-nav="${isEdit?"invoice-detail":"invoices"}" data-nav-id="${isEdit?editing.id:""}">${iconArrowLeft()} ${isEdit?"Zurück":"Alle Rechnungen"}</span>
  <div class="page-head">
    <div><h1>${isEdit ? "Bearbeiten" : "Neu erstellen"}</h1><div class="sub">Rechnung und Lieferschein teilen sich denselben Nummernkreis</div></div>
  </div>

  <form id="invoiceForm">
    <div class="card">
      <div class="field">
        <label>Dokumenttyp</label>
        <select id="f_doctype">
          <option value="rechnung" ${docType==="rechnung"?"selected":""}>Rechnung</option>
          <option value="lieferschein" ${docType==="lieferschein"?"selected":""}>Lieferschein</option>
        </select>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Kunde</label>
          <select id="f_customer" required>
            <option value="">— Kunde auswählen —</option>
            ${customerOptions}
          </select>
        </div>
        <div class="field">
          <label>Nummer</label>
          <input type="text" id="f_number" value="${esc(numberInfo.number)}" disabled class="mono">
          <div class="checkbox-row" style="margin-top:6px;">
            <input type="checkbox" id="f_manualNumber" style="width:auto;">
            <label for="f_manualNumber" style="margin:0;font-weight:500;">Nummer manuell anpassen</label>
          </div>
        </div>
        <div class="field">
          <label>Datum</label>
          <input type="date" id="f_date" value="${date}" required>
        </div>
        <div class="field">
          <label>Zahlungsziel</label>
          <input type="date" id="f_dueDate" value="${dueDate || ""}">
        </div>
        <div class="field">
          <label>Liefer-/Leistungsdatum</label>
          <input type="date" id="f_performanceDate" value="${performanceDate || ""}">
        </div>
        <div class="field">
          <label>Lieferbedingung</label>
          <input type="text" id="f_deliveryTerm" placeholder="z.B. frei Haus" value="${esc(editing ? (editing.deliveryTerm||"") : (prefillLieferschein ? (prefillLieferschein.deliveryTerm||"") : ""))}">
        </div>
        <div class="field">
          <label>Bezug (Lieferschein / Angebot)</label>
          <input type="text" id="f_deliveryRef" placeholder="z.B. Rechnung gem. Lieferung LS2026021" value="${esc(editing?editing.deliveryRef:prefillDeliveryRef)}">
        </div>
        <div class="field">
          <label>Zahlungsart</label>
          <select id="f_paymentMethod">
            <option value="ueberweisung" ${(!editing||editing.paymentMethod==="ueberweisung")?"selected":""}>Überweisung</option>
            <option value="bar" ${editing&&editing.paymentMethod==="bar"?"selected":""}>Bar erhalten</option>
            <option value="sonstiges" ${editing&&editing.paymentMethod==="sonstiges"?"selected":""}>Sonstiges</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f_status">
            ${invoiceStatusOptionsHtml(docType, editing ? editing.status : "offen")}
          </select>
        </div>
      </div>
    </div>

    <div class="card" id="lieferscheinFields" style="display:${docType==="lieferschein"?"":"none"};">
      <h2>Lieferschein-Details</h2>
      <div class="form-grid">
        <div class="field">
          <label>Bearbeiter</label>
          <input type="text" id="f_bearbeiter" value="${esc(editing?(editing.bearbeiter||""):(CURRENT_USER?CURRENT_USER.name:""))}">
        </div>
        <div class="field">
          <label>Angebots-Nr.</label>
          <input type="text" id="f_angebotsnr" placeholder="/" value="${esc(editing?(editing.angebotsNr||""):"")}">
        </div>
        <div class="field">
          <label>Lieferung</label>
          <input type="text" id="f_lieferungart" placeholder="z.B. Standardlieferung" value="${esc(editing?(editing.lieferungArt||""):"Standardlieferung")}">
        </div>
        <div class="field">
          <label>Versandart</label>
          <input type="text" id="f_versandart" placeholder="z.B. Post" value="${esc(editing?(editing.versandart||""):"Post")}">
        </div>
        <div class="field">
          <label>Anzahl Packstücke</label>
          <input type="number" min="0" step="1" id="f_packstuecke" value="${editing?(editing.packstuecke||1):1}">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Positionen</h2>
      <datalist id="productSuggestions">${productDatalist}</datalist>
      <div class="items-table-wrap">
      <table class="items-table mode-${docType}" id="itemsTable">
        <thead><tr>
          <th class="desc-col">Beschreibung</th>
          <th class="num-col">${docType==="lieferschein"?"Auftragsmenge":"Anzahl"}</th>
          <th class="num-col col-price">Preis (€)</th>
          <th class="num-col col-delivered">Liefermenge</th>
          <th class="num-col col-price">Summe</th>
          <th></th>
        </tr></thead>
        <tbody id="itemsBody">
          ${items.map((it, idx) => itemRow(it, idx)).join("")}
        </tbody>
        <tfoot>
          <tr class="items-total-row" id="formTotalRow" style="display:${docType==="lieferschein"?"none":""};"><td colspan="4" style="text-align:right">Endsumme</td><td class="num" id="formTotal">${fmtCurrency(items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0))}</td><td></td></tr>
        </tfoot>
      </table>
      </div>
      <button type="button" class="btn btn-sm" id="btnAddItem" style="margin-top:10px;">${iconPlus()} Position hinzufügen</button>
    </div>

    <div class="head-actions" style="justify-content:flex-end;">
      <button type="button" class="btn" data-nav="${isEdit?"invoice-detail":"invoices"}" data-nav-id="${isEdit?editing.id:""}">Abbrechen</button>
      <button type="submit" class="btn btn-primary">${isEdit ? "Änderungen speichern" : "Rechnung erstellen"}</button>
    </div>
    <input type="hidden" id="f_editId" value="${isEdit ? editing.id : ""}">
  </form>
  `;
}

        <thead><tr><th class="desc-col">Beschreibung</th><th class="num-col">Anzahl</th><th class="num-col">Preis (€)</th><th class="num-col">Summe</th><th></th></tr></thead>
        <tbody id="itemsBody">
          ${items.map((it, idx) => itemRow(it, idx)).join("")}
        </tbody>
        <tfoot>
          <tr class="items-total-row"><td colspan="3" style="text-align:right">Summe</td><td class="num" id="formTotal">${fmtCurrency(items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0))}</td><td></td></tr>
        </tfoot>
      </table>

function itemRow(it, idx) {
  const sum = (Number(it.qty)||0) * (Number(it.price)||0);
  const delivered = it.deliveredQty !== undefined ? it.deliveredQty : it.qty;
  return `
  <tr data-item-row="${idx}">
    <td><input type="text" class="item-desc" list="productSuggestions" value="${esc(it.description)}" placeholder="Artikelbezeichnung" required></td>
    <td><input type="number" class="item-qty" min="0" step="1" value="${it.qty}"></td>
    <td class="col-price"><input type="number" class="item-price" min="0" step="0.01" value="${it.price}"></td>
    <td class="col-delivered"><input type="number" class="item-delivered" min="0" step="1" value="${delivered}"></td>
    <td class="num mono item-sum col-price">${fmtCurrency(sum)}</td>
    <td><button type="button" class="btn btn-sm btn-ghost item-remove">${iconTrash()}</button></td>
  </tr>`;
}

function recalcItemsTotal() {
  const rows = document.querySelectorAll("#itemsBody tr");
  let total = 0;
  rows.forEach(row => {
    const qty = Number(row.querySelector(".item-qty").value) || 0;
    const price = Number(row.querySelector(".item-price").value) || 0;
    const sum = qty * price;
    row.querySelector(".item-sum").textContent = fmtCurrency(sum);
    total += sum;
  });
  const totalEl = document.getElementById("formTotal");
  if (totalEl) totalEl.textContent = fmtCurrency(total);
}

function applyDocTypeToForm(docType) {
  const table = document.getElementById("itemsTable");
  const lsFields = document.getElementById("lieferscheinFields");
  const totalRow = document.getElementById("formTotalRow");
  if (table) table.classList.toggle("mode-lieferschein", docType === "lieferschein");
  if (lsFields) lsFields.style.display = docType === "lieferschein" ? "" : "none";
  if (totalRow) totalRow.style.display = docType === "lieferschein" ? "none" : "";
  const dueDateField = document.getElementById("f_dueDate");
  const paymentMethodField = document.getElementById("f_paymentMethod");
  const performanceDateField = document.getElementById("f_performanceDate");
  if (dueDateField) dueDateField.closest(".field").style.display = docType === "lieferschein" ? "none" : "";
  if (paymentMethodField) paymentMethodField.closest(".field").style.display = docType === "lieferschein" ? "none" : "";
  if (performanceDateField) performanceDateField.closest(".field").style.display = docType === "lieferschein" ? "none" : "";
  const statusField = document.getElementById("f_status");
  if (statusField) {
    const currentValue = statusField.value;
    statusField.innerHTML = invoiceStatusOptionsHtml(docType, currentValue);
  }
}

function openModal(html) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal() {
  const o = document.getElementById("modalOverlay");
  if (o) o.remove();
}

function openCustomerModal(id) {
  const c = id ? customerById(id) : null;
  const contacts = c && Array.isArray(c.contacts) ? c.contacts : [];
  openModal(`
    <h2>${c ? "Kunde bearbeiten" : "Neuer Kunde"}</h2>
    <form id="customerForm">
      <div class="field"><label>Name / Ansprechpartner</label><input type="text" id="m_name" value="${c?esc(c.name):""}" required></div>
      <div class="field"><label>Firma (optional)</label><input type="text" id="m_company" value="${c?esc(c.company):""}"></div>
      <div class="field"><label>Straße</label><input type="text" id="m_street" value="${c?esc(c.street):""}"></div>
      <div class="form-grid">
        <div class="field"><label>PLZ</label><input type="text" id="m_zip" value="${c?esc(c.zip):""}"></div>

      </div>
      <div class="form-grid">
        <div class="field"><label>Haupt-E-Mail</label><input type="text" id="m_email" value="${c?esc(c.email):""}"></div>
        <div class="field"><label>Haupt-Telefon</label><input type="text" id="m_phone" value="${c?esc(c.phone):""}"></div>
      </div>
      <div class="field"><label>Notiz</label><textarea id="m_note">${c?esc(c.note):""}</textarea></div>

      <div class="field">
        <label>Ansprechpartner</label>
        <div id="contactsBody" style="display:flex;flex-direction:column;gap:8px;">
          ${contacts.map((ct, idx) => contactRow(ct, idx)).join("")}
        </div>
        <button type="button" class="btn btn-sm" id="btnAddContact" style="margin-top:8px;align-self:flex-start;">${iconPlus()} Ansprechpartner hinzufügen</button>
      </div>

      <div class="modal-actions">
        ${(c && isAdmin()) ? `<button type="button" class="btn btn-danger" id="btnDeleteCustomer" style="margin-right:auto;">Kunde löschen</button>` : ""}
        <button type="button" class="btn" id="btnCancelModal">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
      <input type="hidden" id="m_id" value="${c?c.id:""}">
    </form>
  `);
  document.getElementById("btnCancelModal").onclick = closeModal;
  if (c && isAdmin()) document.getElementById("btnDeleteCustomer").onclick = () => deleteCustomer(c.id);

  const contactsBody = document.getElementById("contactsBody");
  function wireContactRemove(row) {
    row.querySelector(".contact-remove").addEventListener("click", () => row.remove());
  }
  contactsBody.querySelectorAll(".contact-row").forEach(wireContactRemove);
  document.getElementById("btnAddContact").addEventListener("click", () => {
    const idx = contactsBody.querySelectorAll(".contact-row").length;
    const wrapper = document.createElement("div");
    wrapper.innerHTML = contactRow({ name: "", role: "", email: "", phone: "" }, idx);
    const row = wrapper.firstElementChild;
    contactsBody.appendChild(row);
    wireContactRemove(row);
    row.querySelector(".contact-name").focus();
  });

  document.getElementById("customerForm").onsubmit = async (e) => {
    e.preventDefault();
    const contactRows = Array.from(document.querySelectorAll("#contactsBody .contact-row"));
    const newContacts = contactRows.map(r => ({
      name: r.querySelector(".contact-name").value.trim(),
      role: r.querySelector(".contact-role").value.trim(),
      email: r.querySelector(".contact-email").value.trim(),
      phone: r.querySelector(".contact-phone").value.trim(),
    })).filter(ct => ct.name || ct.email || ct.phone);

    const data = {
      id: document.getElementById("m_id").value || uid("c"),
      name: document.getElementById("m_name").value.trim(),
      company: document.getElementById("m_company").value.trim(),
      street: document.getElementById("m_street").value.trim(),
      zip: document.getElementById("m_zip").value.trim(),
      city: document.getElementById("m_city").value.trim(),
      email: document.getElementById("m_email").value.trim(),
      phone: document.getElementById("m_phone").value.trim(),
      note: document.getElementById("m_note").value.trim(),
      contacts: newContacts,
    };
    if (!data.name) return;
    const existingIdx = DB.customers.findIndex(x => x.id === data.id);
    if (existingIdx >= 0) DB.customers[existingIdx] = data;
    else DB.customers.push(data);
    await saveData();
    closeModal();
    render();
  };
}

function contactRow(ct, idx) {
  return `
  <div class="contact-row" data-contact-row="${idx}" style="border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:10px;">
    <div class="form-grid" style="margin-bottom:8px;">

      <div class="field" style="margin-bottom:0;"><input type="text" class="contact-role" placeholder="Position (z.B. Einkauf)" value="${esc(ct.role||"")}"></div>
    </div>
    <div class="form-grid">
      <div class="field" style="margin-bottom:0;"><input type="text" class="contact-email" placeholder="E-Mail" value="${esc(ct.email||"")}"></div>
      <div class="field" style="margin-bottom:0;"><input type="text" class="contact-phone" placeholder="Telefon" value="${esc(ct.phone||"")}"></div>
    </div>
    <button type="button" class="btn btn-sm btn-ghost contact-remove" style="margin-top:8px;color:var(--rust);">${iconTrash()} Entfernen</button>
  </div>`;
}

async function deleteCustomer(id) {
  if (!isAdmin()) return;
  const usedInInvoices = DB.invoices.some(i => i.customerId === id);
  if (usedInInvoices) {
    if (!confirm("Dieser Kunde hat bereits Rechnungen. Trotzdem löschen? Die Rechnungen bleiben erhalten, zeigen aber keinen Kundennamen mehr an.")) return;
  } else {
    if (!confirm("Diesen Kunden wirklich löschen?")) return;
  }
  DB.customers = DB.customers.filter(c => c.id !== id);
  await saveData();
  closeModal();
  go("customers");
}

function openDeleteInvoiceModal(id) {
  const inv = invoiceById(id);
  if (!inv || !CURRENT_USER) return;
  openModal(`
    <h2>${esc(inv.type === "lieferschein" ? "Lieferschein" : "Rechnung")} ${esc(inv.number)} löschen</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">Das kann nicht rückgängig gemacht werden. Bitte deine PIN eingeben, um zu bestätigen.</p>
    <form id="deleteInvoiceForm">
      <div class="field">
        <label>PIN von ${esc(CURRENT_USER.name)}</label>
        <input type="password" id="del_pin" autofocus autocomplete="off">
      </div>
      <div id="deleteInvoiceError" class="lock-error" style="text-align:left;"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnCancelModal">Abbrechen</button>
        <button type="submit" class="btn btn-danger">Endgültig löschen</button>
      </div>
    </form>
  `);
  document.getElementById("btnCancelModal").onclick = closeModal;
  const form = document.getElementById("deleteInvoiceForm");
  const input = document.getElementById("del_pin");
  input.focus();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const user = (DB.settings.users || []).find(u => u.name === CURRENT_USER.name);
    if (!user || input.value !== user.pin) {
      document.getElementById("deleteInvoiceError").textContent = "Falsche PIN.";
      input.value = "";
      input.focus();
      return;
    }
    DB.invoices = DB.invoices.filter(i => i.id !== id);

    closeModal();

function renderInPlace(tab) {
  // Re-render just the main area content to keep focus/scroll less jumpy for search inputs
  const mainEl = document.querySelector(".main");
  if (!mainEl) return;
  const activeId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  mainEl.innerHTML = renderMain();
  attachGlobalHandlers();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
  }
}

function wireInvoiceForm() {
  const form = document.getElementById("invoiceForm");
  if (!form) return;

  const itemsBody = document.getElementById("itemsBody");

  function wireRow(row) {
    row.querySelector(".item-qty").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-price").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-desc").addEventListener("change", (e) => {
      const opts = document.querySelectorAll("#productSuggestions option");
      for (const o of opts) {
        if (o.value === e.target.value) {
          const priceInput = row.querySelector(".item-price");
          if (priceInput && (!priceInput.value || Number(priceInput.value) === 0)) priceInput.value = o.dataset.price;
          recalcItemsTotal();
          break;
        }
      }
    });
    row.querySelector(".item-remove").addEventListener("click", () => {
      if (itemsBody.querySelectorAll("tr").length <= 1) { row.querySelector(".item-desc").value=""; row.querySelector(".item-qty").value=1; row.querySelector(".item-price").value=0; recalcItemsTotal(); return; }
      row.remove();
      recalcItemsTotal();
    });
  }
  itemsBody.querySelectorAll("tr").forEach(wireRow);

  document.getElementById("btnAddItem").addEventListener("click", () => {
    const idx = itemsBody.querySelectorAll("tr").length;
    const wrapper = document.createElement("tbody");
    wrapper.innerHTML = itemRow({ description: "", qty: 1, price: 0 }, idx);
    const row = wrapper.firstElementChild;
    itemsBody.appendChild(row);
    wireRow(row);
    row.querySelector(".item-desc").focus();
  });

  const dateField = document.getElementById("f_date");
  dateField.addEventListener("change", () => {
    // keep due date roughly in sync only if it wasn't manually diverged much — simplest: leave as is.
  });

  const manualNumberCb = document.getElementById("f_manualNumber");
  const numberField = document.getElementById("f_number");
  if (manualNumberCb && numberField) {
    manualNumberCb.addEventListener("change", () => {
      numberField.disabled = !manualNumberCb.checked;
      if (manualNumberCb.checked) { numberField.focus(); numberField.select(); }
    });
  }

  const docTypeField = document.getElementById("f_doctype");
  if (docTypeField) {
    docTypeField.addEventListener("change", () => {
      applyDocTypeToForm(docTypeField.value);
      recalcItemsTotal();
    });
    // Sichtbarkeit direkt beim Öffnen des Formulars korrekt setzen (wichtig z.B. beim
    // Bearbeiten eines bestehenden Lieferscheins, wo der Dokumenttyp nicht erst geändert wird).
    applyDocTypeToForm(docTypeField.value);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const editId = document.getElementById("f_editId").value;
    const customerId = document.getElementById("f_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("f_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
      deliveredQty: Number(r.querySelector(".item-delivered").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const docType = document.getElementById("f_doctype").value;
    const manualNumber = manualNumberCb && manualNumberCb.checked ? document.getElementById("f_number").value.trim() : "";
    if (manualNumberCb && manualNumberCb.checked && !manualNumber) { showToast("Bitte eine Nummer eingeben oder die manuelle Anpassung abwählen"); return; }

    const payload = {
      type: docType,
      customerId,
      date,
      dueDate: document.getElementById("f_dueDate").value || "",
      performanceDate: document.getElementById("f_performanceDate").value || "",
      deliveryTerm: document.getElementById("f_deliveryTerm").value.trim(),
      deliveryRef: document.getElementById("f_deliveryRef").value.trim(),
      paymentMethod: document.getElementById("f_paymentMethod").value,
      status: document.getElementById("f_status").value,
      items,
      bearbeiter: document.getElementById("f_bearbeiter") ? document.getElementById("f_bearbeiter").value.trim() : "",
      angebotsNr: document.getElementById("f_angebotsnr") ? document.getElementById("f_angebotsnr").value.trim() : "",
      lieferungArt: document.getElementById("f_lieferungart") ? document.getElementById("f_lieferungart").value.trim() : "",
      versandart: document.getElementById("f_versandart") ? document.getElementById("f_versandart").value.trim() : "",
      packstuecke: document.getElementById("f_packstuecke") ? (Number(document.getElementById("f_packstuecke").value) || 0) : 0,
    };

    if (editId) {
      const inv = invoiceById(editId);
      if (manualNumber) inv.number = manualNumber;
      Object.assign(inv, payload);
      await saveData();
      showToast("Aktualisiert");
      go("invoice-detail", editId);
    } else {
      let number;
      if (manualNumber) {
        number = manualNumber;
        // Nummernkreis nur weiterschieben, falls die manuelle Nummer im gültigen Schema liegt und höher ist
        const m = manualNumber.match(/^(\d{4})(\d{3,})$/);
        if (m) {
          const y = Number(m[1]), seq = Number(m[2]);
          if (DB.settings.seqYear === y && seq >= DB.settings.nextSeq) DB.settings.nextSeq = seq + 1;
          else if (DB.settings.seqYear === undefined || y > DB.settings.seqYear) { DB.settings.seqYear = y; DB.settings.nextSeq = seq + 1; }
        }
      } else {
        const info = nextInvoiceNumber(date);
        number = info.number;
        if (DB.settings.seqYear !== info.year) { DB.settings.seqYear = info.year; DB.settings.nextSeq = info.seq + 1; }
        else { DB.settings.nextSeq = info.seq + 1; }
      }
      const newInv = { id: uid("i"), number, createdBy: CURRENT_USER ? CURRENT_USER.name : "Unbekannt", ...payload };
      DB.invoices.push(newInv);
      if (VIEW.prefillOrder) {
        const ord = orderById(VIEW.prefillOrder);
        if (ord) { ord.status = "abgerechnet"; ord.invoiceId = newInv.id; }
        VIEW.prefillOrder = null;
      }
      if (VIEW.prefillQuoteToInvoice) {
        const src = quoteById(VIEW.prefillQuoteToInvoice);
        if (src) { src.status = "umgewandelt"; src.invoiceId = newInv.id; }
        VIEW.prefillQuoteToInvoice = null;
      }
      if (VIEW.prefillLieferschein) {
        const src = invoiceById(VIEW.prefillLieferschein);
        if (src) { src.invoiceId = newInv.id; if (src.status !== "storniert") src.status = "erledigt"; }
        VIEW.prefillLieferschein = null;
      }
      await saveData();
      showToast(docType === "lieferschein" ? "Lieferschein erstellt" : "Rechnung erstellt");
      go("invoice-detail", newInv.id);
    }
  });

  recalcItemsTotal();
}

    const editId = document.getElementById("q_editId").value;
    const customerId = document.getElementById("q_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("q_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const payload = {
      customerId,
      date,
      status: document.getElementById("q_status").value,
      note: document.getElementById("q_note").value.trim(),
      items,
    };

    if (editId) {
      const q = quoteById(editId);
      Object.assign(q, payload);
      await saveData();
      showToast("Angebot aktualisiert");
      go("quote-detail", editId);
    } else {
      const info = nextQuoteNumber(date);
      const newQuote = { id: uid("q"), number: info.number, orderId: null, invoiceId: null, createdBy: CURRENT_USER ? CURRENT_USER.name : "Unbekannt", ...payload };
      DB.quotes.push(newQuote);
      if (DB.settings.quoteSeqYear !== info.year) { DB.settings.quoteSeqYear = info.year; DB.settings.quoteNextSeq = info.seq + 1; }
      else { DB.settings.quoteNextSeq = info.seq + 1; }
      await saveData();
      showToast("Angebot erstellt");
      go("quote-detail", newQuote.id);
    }
  });

  recalcItemsTotal();
}

function runPostRenderHooks() {
  if (VIEW.tab === "dashboard") drawMonthChart();
}

/* ============================================================
   Boot
   ============================================================ */

async function boot() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px;text-align:center;color:#141414;font-family:Georgia,serif;">Lade FreakyWood CRM…</div>`;
  await loadData();
  render();
}

boot();

</script>
