<title>FreakyWood CRM</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --paper:#EDE3CC;
  --panel:#FBF7EC;
  --panel-2:#F5EEDE;
  --ink:#2B1D14;
  --ink-soft:#5C4A3A;
  --ink-faint:#8A765F;
  --line:#D9CBA8;
  --line-soft:#E7DBBF;
  --amber:#A8672B;
  --amber-dark:#7C4A1E;
  --amber-tint:#F1E0C4;
  --rust:#8C3B24;
  --rust-tint:#F3DFD6;
  --sage:#5B6B4F;
  --sage-tint:#E3E9D6;
  --gold:#C99A4A;
  --shadow: 0 1px 2px rgba(43,29,20,0.06), 0 4px 14px rgba(43,29,20,0.06);
  --shadow-lg: 0 8px 24px rgba(43,29,20,0.14), 0 2px 6px rgba(43,29,20,0.08);
  --grain: repeating-linear-gradient(100deg, var(--amber) 0px, var(--amber) 2px, var(--gold) 2px, var(--gold) 3px, transparent 3px, transparent 26px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Work Sans', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'IBM Plex Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{
  display:flex;
  min-height:100vh;
  min-height:100dvh;
}
@keyframes viewIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}
.main > *{animation:viewIn .22s ease both;}
@media (prefers-reduced-motion: reduce){
  .main > *{animation:none;}
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:224px;
  flex-shrink:0;
  background:linear-gradient(180deg,#2B1D14 0%, #241609 100%);
  color:#EFE3CB;
  display:flex;
  flex-direction:column;
  padding:22px 16px 16px;
}
.brand{
  display:flex;
  flex-direction:column;
  margin-bottom:26px;
  padding-left:2px;
}
.brand .brand-word{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:600;
  color:#F6ECD6;
  letter-spacing:.01em;
}
.brand-tag{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#B79A6F;
  margin-top:2px;
}

.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;
  border-radius:6px;
  color:#D9C8A9;
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  border:1px solid transparent;
  transition:background .12s ease, color .12s ease;
  user-select:none;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.9;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#F6ECD6;}
.nav-item.active{background:rgba(168,103,43,.28);color:#F6ECD6;border-color:rgba(201,154,74,.35);}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.09);
  font-size:11px;
  color:#8A7758;
}
.user-badge{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:10px;font-size:12.5px;color:#D9C8A9;font-weight:600;
}
.logout-link{
  background:transparent;border:1px solid rgba(255,255,255,.18);color:#B79A6F;
  font-size:10.5px;padding:3px 9px;border-radius:5px;cursor:pointer;
}
.logout-link:hover{color:#F6ECD6;border-color:rgba(255,255,255,.35);}
.mt-logout{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  background:transparent;border:1px solid rgba(255,255,255,.18);color:#D9C8A9;
  font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:6px;
}
.new-invoice-btn{
  margin-top:18px;
  background:var(--amber);
  color:#FCF6E9;
  border:none;
  padding:10px 14px;
  border-radius:6px;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  box-shadow:0 2px 0 var(--amber-dark);
  transition:transform .08s ease;
}
.new-invoice-btn:hover{filter:brightness(1.06);}
.new-invoice-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--amber-dark);}

/* ---------- Main ---------- */
.main{
  flex:1;
  min-width:0;
  padding:28px 34px 60px;
  max-width:1180px;
}
.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:22px;
  gap:16px;
  flex-wrap:wrap;
  position:relative;
  padding-top:10px;
}
.page-head::before{
  content:"";
  position:absolute;
  top:0;left:0;
  width:46px;height:4px;
  border-radius:3px;
  background:var(--grain);
  opacity:.9;
}
.page-head h1{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:600;
  margin:0 0 4px;
  color:var(--ink);
  letter-spacing:.01em;
}
.page-head .sub{color:var(--ink-soft);font-size:13px;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  font-family:var(--font-body);
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  padding:8px 14px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover{background:var(--panel-2);}
.btn-primary{background:var(--amber);border-color:var(--amber-dark);color:#FCF6E9;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-danger{color:var(--rust);border-color:var(--rust);background:transparent;}
.btn-danger:hover{background:var(--rust-tint);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--panel-2);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-left:3px solid var(--amber);
  border-radius:10px;
  padding:16px 18px;
  box-shadow:var(--shadow);
  transition:box-shadow .15s ease, transform .15s ease;
}
.kpi-card:nth-child(2){border-left-color:var(--sage);}
.kpi-card:nth-child(3){border-left-color:var(--rust);}
.kpi-card:nth-child(4){border-left-color:var(--gold);}
.kpi-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;margin-bottom:8px;}
.kpi-card .value{font-family:var(--font-display);font-size:24px;color:var(--ink);}
.kpi-card .value.mono{font-family:var(--font-mono);}
.kpi-card .delta{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

/* Cards / panels */
.card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:20px 22px;
  margin-bottom:20px;
}
.card h2{font-family:var(--font-display);font-size:17px;margin:0 0 14px;font-weight:600;}
.card h3{font-family:var(--font-display);font-size:15px;margin:0 0 10px;font-weight:600;color:var(--ink-soft);}
.grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:start;}

/* Tables */
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-faint);
  font-weight:700;
  padding:0 10px 8px;
  border-bottom:1px solid var(--line);
}
td{
  padding:10px 10px;
  border-bottom:1px solid var(--line-soft);
  font-size:13.5px;
  vertical-align:middle;
}
tr:last-child td{border-bottom:none;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--panel-2);}
td.num, th.num{text-align:right;font-family:var(--font-mono);}
td.mono{font-family:var(--font-mono);}
.empty-row td{color:var(--ink-faint);text-align:center;padding:26px 0;font-style:italic;}

/* Status stamp */
.stamp{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:3px;
  border:1.5px solid currentColor;
  transform:rotate(-2deg);
}
.stamp.offen{color:var(--amber-dark);background:var(--amber-tint);}
.stamp.bezahlt{color:var(--sage);background:var(--sage-tint);}
.stamp.storniert{color:var(--rust);background:var(--rust-tint);}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field .hint{font-size:11px;color:var(--ink-faint);}
input[type=text], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea{
  font-family:var(--font-body);
  font-size:13.5px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  width:100%;
}
textarea{resize:vertical;min-height:56px;font-family:var(--font-body);}
input:focus, select:focus, textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
.checkbox-row{display:flex;align-items:center;gap:8px;}

/* Line items editor */
.items-table th, .items-table td{padding:7px 8px;}
.items-table input{padding:6px 8px;font-size:13px;}
.items-table .desc-col{width:42%;}
.items-table .num-col{width:12%;}
.items-total-row td{border-top:2px solid var(--ink);font-weight:700;font-family:var(--font-mono);}

/* Search bar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px;}
.search-box input{padding-left:30px;}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.5;}
.filter-select{max-width:180px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,29,20,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal{
  background:var(--panel);
  border-radius:10px;
  max-width:520px;width:100%;
  max-height:90vh;overflow-y:auto;
  padding:24px 26px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.modal h2{font-family:var(--font-display);font-size:18px;margin:0 0 16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

/* Toast */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#F6ECD6;padding:10px 18px;border-radius:8px;
  font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);
  z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* Breadcrumb / link back */
.back-link{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);font-size:12.5px;cursor:pointer;margin-bottom:10px;font-weight:600;}
.back-link:hover{color:var(--amber-dark);}

/* Product / customer chip */
.chip{display:inline-block;background:var(--amber-tint);color:var(--amber-dark);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:600;}

/* Invoice print styling */
.invoice-sheet{
  background:#fff;
  color:#241609;
  padding:0;
  border-radius:8px;
  overflow:visible;
  border:1px solid var(--line-soft);
  box-shadow:var(--shadow-lg);
  font-family: Georgia, 'Iowan Old Style', serif;
  max-width:780px;
  margin:0 auto;
  position:relative;
}
.invoice-body{padding:40px 46px 30px;}
.invoice-topline{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
.invoice-meta h1{font-size:19px;margin:0 0 4px;letter-spacing:.02em;}
.invoice-meta .date{font-size:12.5px;color:#5C4A3A;}
.invoice-logo{width:150px;height:auto;flex-shrink:0;}
.invoice-sender{text-align:right;font-size:11px;color:#5C4A3A;line-height:1.5;margin-top:10px;}
.invoice-addr-block{margin-top:26px;}
.invoice-addr-block .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8A765F;margin-bottom:4px;}
.invoice-addr-block .addr{font-size:13.5px;line-height:1.5;}
.invoice-terms{margin-top:16px;font-size:12px;color:#5C4A3A;}
.invoice-items{margin-top:26px;width:100%;border-collapse:collapse;}
.invoice-items th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:#8A765F;border-bottom:1.5px solid #2B1D14;padding:0 8px 8px;font-family:var(--font-body);
}
.invoice-items td{padding:9px 8px;border-bottom:1px solid #E7DBBF;font-size:13px;}
.invoice-items th.num, .invoice-items td.num{text-align:right;font-variant-numeric:tabular-nums;}
.invoice-items tr.total-row td{border-top:2px solid #2B1D14;border-bottom:none;font-weight:700;font-size:14px;}
.invoice-vat-note{text-align:right;font-size:11px;color:#8A765F;margin-top:4px;font-style:italic;}
.invoice-footnote{margin-top:30px;font-size:12.5px;color:#3B2A1C;line-height:1.6;}

.invoice-real-footer{
  margin-top:34px;
  padding:16px 46px;
  border-top:1px solid #E7DBBF;
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  font-size:10px;color:#8A765F;font-family:var(--font-body);line-height:1.6;
}
.invoice-real-footer b{color:#5C4A3A;display:block;font-size:10px;margin-bottom:2px;}
.footer-contact-line{display:flex;align-items:center;gap:5px;}
.footer-contact-line svg{flex-shrink:0;}

@page{
  size: A4;
  margin: 12mm;
}
@media print{
  .sidebar, .page-head .head-actions, .no-print, .toolbar, #toast, .bottom-nav, .fab, .mobile-topbar{display:none !important;}
  .main{padding:0;max-width:100%;}
  body{background:#fff;}
  #app{display:block;}

  /* Rechnungsblatt auf A4-Innenhöhe bringen; Fußzeile per position:absolute
     zuverlässig an den unteren Blattrand setzen (funktioniert stabil in
     jedem Browser-PDF-Export). Bei sehr langen Rechnungen wächst das Blatt
     einfach mit, ohne dass etwas überlappt. */
  .invoice-sheet{
    border:none;box-shadow:none;border-radius:0;max-width:100%;margin:0;
    min-height:273mm; /* A4 (297mm) minus 2x12mm Seitenrand */
    padding-bottom:120px;
  }
  .invoice-real-footer{
    position:absolute;
    left:0;right:0;bottom:0;
    margin-top:0;
  }
}

.dash-charts{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

/* Lock screen */
.lock-screen{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 20%, #3A2818 0%, #241609 70%);
  padding:20px;
}
.lock-card{
  background:var(--panel);
  border-radius:14px;
  padding:36px 32px;
  max-width:340px;width:100%;
  text-align:center;
  box-shadow:var(--shadow-lg);
}
.lock-logo{width:150px;height:auto;margin:0 auto 18px;display:block;}
.lock-card h1{font-family:var(--font-display);font-size:19px;margin:0 0 6px;}
.lock-card p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
.lock-card input{text-align:center;letter-spacing:.12em;font-size:16px;padding:12px;}
.lock-error{color:var(--rust);font-size:12.5px;min-height:18px;margin-top:8px;}
.legend-list{list-style:none;margin:0;padding:0;}
.legend-list li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.legend-list li:last-child{border-bottom:none;}
.legend-list .rank{color:var(--ink-faint);font-family:var(--font-mono);width:20px;display:inline-block;}

.more-list{display:flex;flex-direction:column;gap:10px;}
.more-item{
  display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line-soft);
  border-radius:12px;padding:16px;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.more-item .mi-icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--amber-tint);color:var(--amber-dark);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.more-item .mi-icon svg{width:20px;height:20px;}
.more-item .mi-text b{display:block;font-size:14.5px;}
.more-item .mi-text span{font-size:12px;color:var(--ink-faint);}
.more-item .mi-chevron{margin-left:auto;color:var(--ink-faint);}

/* ---------- Mobile top bar & bottom nav (native app shell) ---------- */
.mobile-topbar, .bottom-nav, .fab{display:none;}

@media (max-width: 860px){
  #app{flex-direction:column;}
  .sidebar{display:none;}

  .mobile-topbar{
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:50;
    background:linear-gradient(180deg,#2B1D14 0%, #241609 100%);
    color:#F6ECD6;
    padding:calc(12px + var(--safe-top)) 16px 12px;
  }
  .mobile-topbar .mt-word{font-family:var(--font-display);font-size:17px;font-weight:600;}
  .mobile-topbar .mt-title{
    font-family:var(--font-display);font-size:13px;font-weight:500;
    padding-left:12px;border-left:1px solid rgba(255,255,255,.18);color:#D9C8A9;
  }

  .main{padding:16px 14px calc(96px + var(--safe-bottom));max-width:100%;}
  .form-grid, .kpi-row, .dash-charts, .grid-2{grid-template-columns:1fr;}
  .kpi-row{gap:10px;}
  .page-head{align-items:flex-start;}
  .page-head .head-actions{width:100%;}
  .page-head .head-actions .btn{flex:1;justify-content:center;}

  /* Bottom tab bar */
  .bottom-nav{
    display:flex;
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:60;
    background:linear-gradient(180deg,#2B1D14 0%, #1E1409 100%);
    padding:6px 6px calc(6px + var(--safe-bottom));
    box-shadow:0 -4px 18px rgba(0,0,0,.25);
  }
  .bn-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    color:#B79A6F;
    font-size:10px;
    font-weight:600;
    border-radius:10px;
  }
  .bn-item svg{width:20px;height:20px;}
  .bn-item.active{color:#F6ECD6;}
  .bn-item.active svg{color:var(--gold);}
  .bn-item.bn-main{
    color:#FCF6E9;
  }
  .bn-item.bn-main .bn-main-circle{
    width:42px;height:42px;border-radius:50%;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 var(--amber-dark);
    margin-top:-20px;
    border:3px solid #241609;
  }
  .bn-item.bn-main .bn-main-circle svg{width:19px;height:19px;}

  /* Floating action button as backup on list screens */
  .fab{
    display:flex;
    position:fixed;
    right:18px;
    bottom:calc(78px + var(--safe-bottom));
    z-index:55;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--amber);
    color:#fff;
    align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(43,29,20,.35);
    border:none;
  }
  .fab svg{width:22px;height:22px;}

  /* Tables -> stacked cards */
  .card table thead{display:none;}
  .card table, .card table tbody, .card table tr, .card table td{display:block;width:100%;}
  .card table{border:none;}
  .card table tr{
    padding:12px 4px;
    border-bottom:1px solid var(--line-soft);
  }
  .card table tr.empty-row{padding:26px 4px;}
  .card table td{
    border-bottom:none;
    padding:3px 4px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
  }
  .card table td.num{text-align:right;}
  .card table td[data-label]::before{
    content:attr(data-label);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:700;
    flex-shrink:0;
  }
  .card table td:not([data-label])::before{content:none;}
  .card{padding:14px 14px;border-radius:12px;}
  .card h2{font-size:15.5px;}

  /* Modals become bottom sheets */
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal{
    max-width:100%;
    width:100%;
    border-radius:16px 16px 0 0;
    max-height:88vh;
    padding:20px 18px calc(20px + var(--safe-bottom));
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4;} to{transform:translateY(0);opacity:1;}}

  .toolbar{flex-direction:column;align-items:stretch;}
  .search-box{max-width:100%;}
  .filter-select{max-width:100%;}

  .items-table-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px;}
  .items-table{min-width:520px;}

  .invoice-body{padding:24px 18px 30px;overflow-x:auto;}
  .invoice-items{font-size:11.5px;min-width:520px;}
  .invoice-topline{flex-direction:column-reverse;gap:16px;}
  .invoice-topline > div{text-align:left !important;}
  .invoice-logo{width:120px;}
  .invoice-sender{margin-top:8px;}
  .invoice-real-footer{grid-template-columns:1fr 1fr;padding:16px 18px;}

  .btn{min-height:40px;}
}

@media (max-width:420px){
  .kpi-row{grid-template-columns:1fr 1fr;}
}
</style>

<script>
/* ============================================================
   FreakyWood CRM — App-Logik
   ============================================================ */

const STORAGE_KEY = "freakywood-crm-data-v1";

let DB = null;           // { customers, products, invoices, settings }
let VIEW = { tab: "dashboard", id: null }; // current view state
let STORAGE_OK = true;
let APP_UNLOCKED = false;
let CURRENT_USER = null; // { name, role: 'admin' | 'user' }

/* ---------------- Storage (Supabase) ---------------- */

function ensureUserDefaults(db) {
  if (!db.settings) return;
  if (!db.settings.users || !Array.isArray(db.settings.users) || db.settings.users.length === 0) {
    db.settings.users = [
      { name: "Wayne", pin: "0109", role: "user" },
      { name: "Jan", pin: "1908", role: "admin" }
    ];
  }
}

async function loadData() {
  try {
    const { data, error } = await sbClient
      .from('crm_kv')
      .select('value')
      .eq('key', STORAGE_KEY)
      .maybeSingle();

    if (error) {
      // Echter Fehler (Rechte/Netzwerk) — NIEMALS in diesem Fall überschreiben,
      // sonst gehen bestehende Daten verloren. Stattdessen deutlich warnen.
      console.error("Fehler beim Laden aus Supabase:", error);
      DB = JSON.parse(JSON.stringify(SEED_DATA));
      ensureUserDefaults(DB);
      DB.__loadError = error.message || "Verbindung zur Datenbank fehlgeschlagen.";
      return;
    }

    if (data && data.value) {
      DB = data.value;
      ensureUserDefaults(DB);
      return;
    }

    // Kein Fehler, aber wirklich noch keine Zeile vorhanden -> einmaliger Erststart
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    ensureUserDefaults(DB);
    await saveData(true);
  } catch (e) {
    console.error("Verbindung zu Supabase fehlgeschlagen:", e);
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    ensureUserDefaults(DB);
    DB.__loadError = e && e.message ? e.message : "Verbindung zur Datenbank fehlgeschlagen.";
  }
}

async function saveData(silent) {
  try {
    const { error } = await sbClient
      .from('crm_kv')
      .upsert({ key: STORAGE_KEY, value: DB, updated_at: new Date().toISOString() });
    if (error) throw error;
    STORAGE_OK = true;
    if (!silent) showToast("Gespeichert");
  } catch (e) {
    STORAGE_OK = false;
    console.error("Speicherfehler:", e);
    showToast("⚠ Speichern fehlgeschlagen — Änderung ggf. nicht dauerhaft");
  }
}

/* ---------------- Helpers ---------------- */

function uid(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 9);
}

function fmtCurrency(n) {
  n = Number(n) || 0;
  return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}

function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${d}.${m}.${y}`;
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function addDaysISO(iso, days) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function customerById(id) {
  return DB.customers.find(c => c.id === id);
}
function productById(id) {
  return DB.products.find(p => p.id === id);
}
function invoiceById(id) {
  return DB.invoices.find(i => i.id === id);
}
function invoiceTotal(inv) {
  return inv.items.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
}
function customerName(c) {
  if (!c) return "Unbekannter Kunde";
  return c.company ? `${c.name} — ${c.company}` : c.name;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function nextInvoiceNumber(dateISO) {
  const year = (dateISO || todayISO()).slice(0, 4);
  const y = Number(year);
  let seq = DB.settings.nextSeq;
  if (DB.settings.seqYear !== y) {
    // new year -> could reset to 1, but keep continuing sequence is safer for bookkeeping continuity;
    // we reset per calendar year to match the observed numbering scheme (YYYY + running number).
    seq = 1;
  }
  return { number: `${y}${String(seq).padStart(3, "0")}`, year: y, seq };
}

/* ---------------- Navigation ---------------- */

function go(tab, id) {
  VIEW = { tab, id: id || null };
  render();
  window.scrollTo(0, 0);
}

/* ---------------- Shell / Render root ---------------- */

function render() {
  const app = document.getElementById("app");
  const usersConfigured = DB.settings.users && DB.settings.users.length > 0;
  if (usersConfigured && (!APP_UNLOCKED || !CURRENT_USER)) {
    app.innerHTML = renderLockScreen();
    wireLockScreen();
    return;
  }
  app.innerHTML = `
    ${renderSidebar()}
    ${renderMobileTopbar()}
    <div class="main">${DB.__loadError ? renderConnectionError() : ""}${renderMain()}</div>
    ${renderBottomNav()}
    ${renderFab()}
  `;
  attachGlobalHandlers();
  runPostRenderHooks();
}

function renderConnectionError() {
  return `

function renderLockScreen() {
  const users = DB.settings.users || [];
  return `
  <div class="lock-screen">
    <div class="lock-card">
      <img src="${LOGO_BANNER}" alt="FreakyWood" class="lock-logo">

      <form id="lockForm">
        <div class="field" style="text-align:left;">
          <label>Name</label>
          <select id="lockUser">
            ${users.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join("")}
          </select>
        </div>
        <input type="password" inputmode="text" id="lockInput" placeholder="PIN" autofocus autocomplete="off">
        <div id="lockError" class="lock-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px;">Anmelden</button>
      </form>
    </div>
  </div>`;
}

function wireLockScreen() {
  const form = document.getElementById("lockForm");
  const input = document.getElementById("lockInput");
  const userSelect = document.getElementById("lockUser");
  input.focus();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const chosen = (DB.settings.users || []).find(u => u.name === userSelect.value);
    if (chosen && input.value === chosen.pin) {
      APP_UNLOCKED = true;
      CURRENT_USER = { name: chosen.name, role: chosen.role || "user" };
      render();
    } else {
      document.getElementById("lockError").textContent = "Falscher PIN. Bitte erneut versuchen.";
      input.value = "";
      input.focus();
    }
  });
}

function renderDashboard() {
  const years = Array.from(new Set(DB.invoices.map(i => i.date.slice(0, 4)))).sort();
  const selYear = VIEW.dashYear || years[years.length - 1] || String(new Date().getFullYear());
  const invs = DB.invoices.filter(i => i.date.slice(0, 4) === selYear && i.status !== "storniert");

  const totalRevenue = invs.reduce((s, i) => s + invoiceTotal(i), 0);
  const openAmount = invs.filter(i => i.status === "offen").reduce((s, i) => s + invoiceTotal(i), 0);
  const avgInvoice = invs.length ? totalRevenue / invs.length : 0;

  // revenue by month
  const monthNames = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const byMonth = new Array(12).fill(0);
  invs.forEach(i => { byMonth[Number(i.date.slice(5,7)) - 1] += invoiceTotal(i); });

  // top customers
  const custRevenue = {};
  invs.forEach(i => { custRevenue[i.customerId] = (custRevenue[i.customerId] || 0) + invoiceTotal(i); });
  const topCustomers = Object.entries(custRevenue).sort((a,b) => b[1]-a[1]).slice(0,6);

  // top products
  const prodStats = {};
  invs.forEach(i => i.items.forEach(it => {
    const key = it.description;
    if (!prodStats[key]) prodStats[key] = { qty: 0, revenue: 0 };
    prodStats[key].qty += Number(it.qty) || 0;
    prodStats[key].revenue += (Number(it.qty)||0) * (Number(it.price)||0);
  }));
  const topProducts = Object.entries(prodStats).sort((a,b) => b[1].revenue - a[1].revenue).slice(0,8);

  return `
  <div class="page-head">
    <div>
      <h1>Auswertungen</h1>
      <div class="sub">Umsatz- und Kundenübersicht für ${esc(DB.settings.company.brand)}</div>
    </div>
    <div class="head-actions">
      <select class="filter-select" id="dashYearSelect">
        ${years.map(y => `<option value="${y}" ${y===selYear?"selected":""}>${y}</option>`).join("")}
      </select>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="label">Umsatz ${esc(selYear)}</div><div class="value mono">${fmtCurrency(totalRevenue)}</div></div>
    <div class="kpi-card"><div class="label">Rechnungen</div><div class="value mono">${invs.length}</div></div>
    <div class="kpi-card"><div class="label">Offene Forderungen</div><div class="value mono">${fmtCurrency(openAmount)}</div></div>
    <div class="kpi-card"><div class="label">Ø Rechnungswert</div><div class="value mono">${fmtCurrency(avgInvoice)}</div></div>
  </div>

  <div class="dash-charts">
    <div class="card">
      <h2>Umsatz pro Monat</h2>
      <div id="monthChartWrap" style="position:relative;height:230px;">
        <canvas id="monthChart" data-values='${JSON.stringify(byMonth)}' data-labels='${JSON.stringify(monthNames)}'></canvas>
      </div>
    </div>
    <div class="card">
      <h2>Top Kunden</h2>
      <ul class="legend-list">
        ${topCustomers.length ? topCustomers.map(([cid, rev], idx) => `
          <li><span><span class="rank">${idx+1}.</span>${esc(customerName(customerById(cid)))}</span><span class="mono">${fmtCurrency(rev)}</span></li>
        `).join("") : `<li style="color:var(--ink-faint)">Keine Daten für dieses Jahr</li>`}
      </ul>
    </div>
  </div>

  <div class="card">
    <h2>Meistverkaufte Artikel</h2>
    <table>
      <thead><tr><th>Artikel</th><th class="num">Menge</th><th class="num">Umsatz</th></tr></thead>
      <tbody>
        ${topProducts.length ? topProducts.map(([desc, s]) => `
          <tr><td>${esc(desc)}</td><td class="num">${s.qty}</td><td class="num">${fmtCurrency(s.revenue)}</td></tr>
        `).join("") : `<tr class="empty-row"><td colspan="3">Keine Artikeldaten für dieses Jahr</td></tr>`}
      </tbody>
    </table>
  </div>
  `;
}

function drawMonthChart() {
  const canvas = document.getElementById("monthChart");
  if (!canvas) return;
  if (typeof Chart === "undefined") {
    const wrap = document.getElementById("monthChartWrap");
    if (wrap) wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:12.5px;text-align:center;padding:0 20px;">Diagramm-Bibliothek konnte nicht geladen werden (evtl. Adblocker oder keine Internetverbindung). Zahlen unten sind trotzdem korrekt.</div>`;
    return;
  }
  const values = JSON.parse(canvas.dataset.values);
  const labels = JSON.parse(canvas.dataset.labels);
  if (canvas._chart) canvas._chart.destroy();
  canvas._chart = new Chart(canvas.getContext("2d"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: "#A8672B",
        borderRadius: 4,
        maxBarThickness: 34,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: (ctx) => fmtCurrency(ctx.parsed.y)
      } } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: (v) => v + " €" }, grid: { color: "#E7DBBF" } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderCustomerDetail(id) {

  const openAmt = invs.filter(i=>i.status==="offen").reduce((s,i)=>s+invoiceTotal(i),0);

  const artStats = {};
  invs.forEach(i => i.items.forEach(it => {
    if (!artStats[it.description]) artStats[it.description] = { qty:0, revenue:0, last:"" };
    artStats[it.description].qty += Number(it.qty)||0;
    artStats[it.description].revenue += (Number(it.qty)||0)*(Number(it.price)||0);
    if (!artStats[it.description].last || i.date > artStats[it.description].last) artStats[it.description].last = i.date;
  }));
  const artList = Object.entries(artStats).sort((a,b)=>b[1].revenue-a[1].revenue);

  return `
  <span class="back-link" data-nav="customers">${iconArrowLeft()} Alle Kunden</span>

    <div class="kpi-card"><div class="label">Offen</div><div class="value mono">${fmtCurrency(openAmt)}</div></div>

  </div>

  <div class="grid-2">
    <div>
      <div class="card">
        <h2>Rechnungshistorie</h2>

          <thead><tr><th>Nr.</th><th>Datum</th><th class="num">Betrag</th><th>Status</th></tr></thead>

                <td class="num" data-label="Betrag">${fmtCurrency(invoiceTotal(i))}</td>

              </tr>`).join("") : `<tr class="empty-row"><td colspan="4">Noch keine Rechnungen</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Kontakt &amp; Adresse</h2>
        <div style="font-size:13.5px;line-height:1.7;">
          ${c.street ? esc(c.street)+"<br>" : ""}${c.zip||""} ${esc(c.city||"")}<br>
          ${c.email ? `E-Mail: ${esc(c.email)}<br>`:""}
          ${c.phone ? `Telefon: ${esc(c.phone)}<br>`:""}

            </li>`).join("") : `<li style="color:var(--ink-faint)">Keine Artikel</li>`}

  `;
}

function statusStamp(status) {
  const map = { offen: "offen", bezahlt: "bezahlt", storniert: "storniert" };
  return `<span class="stamp ${status}">${map[status] || status}</span>`;
}

function renderInvoices() {
  const q = (VIEW.invSearch || "").toLowerCase();
  const statusFilter = VIEW.invStatusFilter || "";
  let list = DB.invoices.slice().sort((a,b) => b.number.localeCompare(a.number) || b.date.localeCompare(a.date));
  if (statusFilter) list = list.filter(i => i.status === statusFilter);
  if (q) list = list.filter(i => {
    const cust = customerById(i.customerId);
    return i.number.toLowerCase().includes(q) || (cust && customerName(cust).toLowerCase().includes(q));
  });

  const totalShown = list.reduce((s,i)=>s+invoiceTotal(i),0);

  return `
  <div class="page-head">
    <div><h1>Rechnungen</h1><div class="sub">${DB.invoices.length} Rechnungen · ${fmtCurrency(totalShown)} in aktueller Ansicht</div></div>

  </div>

      <option value="">Alle Status</option>
      <option value="offen" ${statusFilter==="offen"?"selected":""}>Offen</option>
      <option value="bezahlt" ${statusFilter==="bezahlt"?"selected":""}>Bezahlt</option>

      <thead><tr><th>Nr.</th><th>Datum</th><th>Kunde</th><th class="num">Betrag</th><th>Status</th></tr></thead>

        ${list.length ? list.map(i => `

  const c = DB.settings.company;
  if (inv.paymentMethod === "bar") {

  if (inv.status === "bezahlt") {
    return "Vielen Dank für deine Bestellung! Der Rechnungsbetrag ist beglichen.";

  if (inv.dueDate) {
    return `Vielen Dank für deine Bestellung!<br>Bitte überweise den Rechnungsbetrag bis zum ${fmtDate(inv.dueDate)} ohne Abzüge auf das unten aufgeführte Konto.`;

          <label>Rechnungsnummer</label>

        </div>
        <div class="field">
          <label>Rechnungsdatum</label>
          <input type="date" id="f_date" value="${date}" required>

        <div class="field">
          <label>Zahlungsziel</label>
          <input type="date" id="f_dueDate" value="${dueDate || ""}">
        </div>
        <div class="field">
          <label>Lieferbedingung</label>

            <option value="offen" ${(!editing||editing.status==="offen")?"selected":""}>Offen</option>
            <option value="bezahlt" ${editing&&editing.status==="bezahlt"?"selected":""}>Bezahlt</option>

      </div>

      <h2>Positionen</h2>
      <datalist id="productSuggestions">${productDatalist}</datalist>

        <thead><tr><th class="desc-col">Beschreibung</th><th class="num-col">Anzahl</th><th class="num-col">Preis (€)</th><th class="num-col">Summe</th><th></th></tr></thead>

          ${items.map((it, idx) => itemRow(it, idx)).join("")}
        </tbody>
        <tfoot>
          <tr class="items-total-row"><td colspan="3" style="text-align:right">Endsumme</td><td class="num" id="formTotal">${fmtCurrency(items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0))}</td><td></td></tr>

      <button type="button" class="btn" data-nav="${isEdit?"invoice-detail":"invoices"}" data-nav-id="${isEdit?editing.id:""}">Abbrechen</button>

    </div>
    <input type="hidden" id="f_editId" value="${isEdit ? editing.id : ""}">

}

function itemRow(it, idx) {
  const sum = (Number(it.qty)||0) * (Number(it.price)||0);
  return `
  <tr data-item-row="${idx}">
    <td><input type="text" class="item-desc" list="productSuggestions" value="${esc(it.description)}" placeholder="Artikelbezeichnung" required></td>
    <td><input type="number" class="item-qty" min="0" step="1" value="${it.qty}"></td>
    <td><input type="number" class="item-price" min="0" step="0.01" value="${it.price}"></td>
    <td class="num mono item-sum">${fmtCurrency(sum)}</td>
    <td><button type="button" class="btn btn-sm btn-ghost item-remove">${iconTrash()}</button></td>
  </tr>`;
}

function recalcItemsTotal() {
  const rows = document.querySelectorAll("#itemsBody tr");
  let total = 0;
  rows.forEach(row => {
    const qty = Number(row.querySelector(".item-qty").value) || 0;
    const price = Number(row.querySelector(".item-price").value) || 0;
    const sum = qty * price;
    row.querySelector(".item-sum").textContent = fmtCurrency(sum);
    total += sum;
  });
  const totalEl = document.getElementById("formTotal");
  if (totalEl) totalEl.textContent = fmtCurrency(total);
}

   ============================================================ */

function openModal(html) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal() {
  const o = document.getElementById("modalOverlay");
  if (o) o.remove();
}

function openCustomerModal(id) {
  const c = id ? customerById(id) : null;
  openModal(`
    <h2>${c ? "Kunde bearbeiten" : "Neuer Kunde"}</h2>
    <form id="customerForm">
      <div class="field"><label>Name / Ansprechpartner</label><input type="text" id="m_name" value="${c?esc(c.name):""}" required></div>
      <div class="field"><label>Firma (optional)</label><input type="text" id="m_company" value="${c?esc(c.company):""}"></div>
      <div class="field"><label>Straße</label><input type="text" id="m_street" value="${c?esc(c.street):""}"></div>
      <div class="form-grid">
        <div class="field"><label>PLZ</label><input type="text" id="m_zip" value="${c?esc(c.zip):""}"></div>
        <div class="field"><label>Ort</label><input type="text" id="m_city" value="${c?esc(c.city):""}"></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>E-Mail</label><input type="text" id="m_email" value="${c?esc(c.email):""}"></div>
        <div class="field"><label>Telefon</label><input type="text" id="m_phone" value="${c?esc(c.phone):""}"></div>
      </div>
      <div class="field"><label>Notiz</label><textarea id="m_note">${c?esc(c.note):""}</textarea></div>
      <div class="modal-actions">
        ${(c && isAdmin()) ? `<button type="button" class="btn btn-danger" id="btnDeleteCustomer" style="margin-right:auto;">Kunde löschen</button>` : ""}
        <button type="button" class="btn" id="btnCancelModal">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
      <input type="hidden" id="m_id" value="${c?c.id:""}">
    </form>
  `);
  document.getElementById("btnCancelModal").onclick = closeModal;
  if (c && isAdmin()) document.getElementById("btnDeleteCustomer").onclick = () => deleteCustomer(c.id);
  document.getElementById("customerForm").onsubmit = async (e) => {
    e.preventDefault();
    const data = {
      id: document.getElementById("m_id").value || uid("c"),
      name: document.getElementById("m_name").value.trim(),
      company: document.getElementById("m_company").value.trim(),
      street: document.getElementById("m_street").value.trim(),
      zip: document.getElementById("m_zip").value.trim(),
      city: document.getElementById("m_city").value.trim(),
      email: document.getElementById("m_email").value.trim(),
      phone: document.getElementById("m_phone").value.trim(),
      note: document.getElementById("m_note").value.trim(),
    };
    if (!data.name) return;
    const existingIdx = DB.customers.findIndex(x => x.id === data.id);
    if (existingIdx >= 0) DB.customers[existingIdx] = data;
    else DB.customers.push(data);
    await saveData();
    closeModal();
    render();
  };
}

async function deleteCustomer(id) {
  if (!isAdmin()) return;
  const usedInInvoices = DB.invoices.some(i => i.customerId === id);
  if (usedInInvoices) {
    if (!confirm("Dieser Kunde hat bereits Rechnungen. Trotzdem löschen? Die Rechnungen bleiben erhalten, zeigen aber keinen Kundennamen mehr an.")) return;
  } else {
    if (!confirm("Diesen Kunden wirklich löschen?")) return;
  }
  DB.customers = DB.customers.filter(c => c.id !== id);
  await saveData();
  closeModal();
  go("customers");
}

function openProductModal(id) {
  const p = id ? productById(id) : null;
  openModal(`
    <h2>${p ? "Artikel bearbeiten" : "Neuer Artikel"}</h2>
    <form id="productForm">
      <div class="field"><label>Artikelbezeichnung</label><input type="text" id="m_pname" value="${p?esc(p.name):""}" required></div>
      <div class="form-grid">
        <div class="field"><label>Einheit</label><input type="text" id="m_unit" value="${p?esc(p.unit):"Stück"}"></div>
        <div class="field"><label>Standardpreis (€)</label><input type="number" step="0.01" min="0" id="m_price" value="${p?p.price:0}"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnCancelModal">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
      <input type="hidden" id="m_pid" value="${p?p.id:""}">
    </form>
  `);
  document.getElementById("btnCancelModal").onclick = closeModal;
  document.getElementById("productForm").onsubmit = async (e) => {
    e.preventDefault();
    const data = {
      id: document.getElementById("m_pid").value || uid("p"),
      name: document.getElementById("m_pname").value.trim(),
      unit: document.getElementById("m_unit").value.trim(),
      price: Number(document.getElementById("m_price").value) || 0,
    };
    if (!data.name) return;
    const idx = DB.products.findIndex(x => x.id === data.id);
    if (idx >= 0) DB.products[idx] = data;
    else DB.products.push(data);
    await saveData();
    closeModal();
    render();
  };
}

async function deleteProduct(id) {
  if (!isAdmin()) return;
  if (!confirm("Diesen Artikel aus dem Katalog löschen? Bereits geschriebene Rechnungen bleiben unverändert.")) return;
  DB.products = DB.products.filter(p => p.id !== id);
  await saveData();
  render();
}

function openDeleteInvoiceModal(id) {
  if (!isAdmin()) return;
  const inv = invoiceById(id);
  if (!inv) return;
  openModal(`
    <h2>Rechnung ${esc(inv.number)} löschen</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">Das kann nicht rückgängig gemacht werden. Wirklich endgültig löschen?</p>
    <div class="modal-actions">
      <button type="button" class="btn" id="btnCancelModal">Abbrechen</button>
      <button type="button" class="btn btn-danger" id="btnConfirmDeleteInvoice">Endgültig löschen</button>
    </div>
  `);
  document.getElementById("btnCancelModal").onclick = closeModal;
  document.getElementById("btnConfirmDeleteInvoice").onclick = async () => {
    DB.invoices = DB.invoices.filter(i => i.id !== id);
    await saveData();
    closeModal();
    go("invoices");
    showToast("Rechnung gelöscht");
  };
}

/* ============================================================
   Event wiring
   ============================================================ */

function attachGlobalHandlers() {
  document.querySelectorAll("[data-logout]").forEach(el => {
    el.addEventListener("click", () => {
      APP_UNLOCKED = false;
      CURRENT_USER = null;
      VIEW = { tab: "dashboard", id: null };
      render();
    });
  });

  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => {
      const tab = el.dataset.nav;
      const navId = el.dataset.navId || null;
      if (tab === "invoice-new" && el.dataset.prefillCustomer) {
        VIEW.prefillCustomer = el.dataset.prefillCustomer;
      } else if (tab !== VIEW.tab) {
        VIEW.prefillCustomer = null;
      }
      go(tab, navId);
    });
  });

  document.querySelectorAll("[data-goto-customer]").forEach(el => {
    el.addEventListener("click", () => go("customer-detail", el.dataset.gotoCustomer));
  });
  document.querySelectorAll("[data-goto-invoice]").forEach(el => {
    el.addEventListener("click", () => go("invoice-detail", el.dataset.gotoInvoice));
  });
  document.querySelectorAll("[data-edit-customer]").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); openCustomerModal(el.dataset.editCustomer); });
  });
  document.querySelectorAll("[data-edit-product]").forEach(el => {
    el.addEventListener("click", () => openProductModal(el.dataset.editProduct));
  });
  document.querySelectorAll("[data-delete-product]").forEach(el => {
    el.addEventListener("click", () => deleteProduct(el.dataset.deleteProduct));
  });
  document.querySelectorAll("[data-delete-invoice]").forEach(el => {
    el.addEventListener("click", () => openDeleteInvoiceModal(el.dataset.deleteInvoice));
  });

  const btnNewCustomer = document.getElementById("btnNewCustomer");
  if (btnNewCustomer) btnNewCustomer.onclick = () => openCustomerModal(null);
  const btnNewProduct = document.getElementById("btnNewProduct");
  if (btnNewProduct) btnNewProduct.onclick = () => openProductModal(null);

  const custSearch = document.getElementById("custSearchInput");
  if (custSearch) custSearch.oninput = (e) => { VIEW.custSearch = e.target.value; renderInPlace("customers"); };
  const prodSearch = document.getElementById("prodSearchInput");
  if (prodSearch) prodSearch.oninput = (e) => { VIEW.prodSearch = e.target.value; renderInPlace("products"); };
  const invSearch = document.getElementById("invSearchInput");
  if (invSearch) invSearch.oninput = (e) => { VIEW.invSearch = e.target.value; renderInPlace("invoices"); };
  const invStatusFilter = document.getElementById("invStatusFilter");
  if (invStatusFilter) invStatusFilter.onchange = (e) => { VIEW.invStatusFilter = e.target.value; render(); };
  const dashYearSelect = document.getElementById("dashYearSelect");
  if (dashYearSelect) dashYearSelect.onchange = (e) => { VIEW.dashYear = e.target.value; render(); };

  const statusChanger = document.getElementById("statusChanger");
  if (statusChanger) statusChanger.onchange = async (e) => {
    const inv = invoiceById(e.target.dataset.invoiceId);
    if (inv) { inv.status = e.target.value; await saveData(); render(); }
  };

  const btnPrint = document.getElementById("btnPrintInvoice");
  if (btnPrint) btnPrint.onclick = () => window.print();

  const btnResetData = document.getElementById("btnResetData");
  if (btnResetData) btnResetData.onclick = async () => {
    if (!isAdmin()) return;
    if (!confirm("Wirklich ALLE Daten löschen und auf die Startdaten (2026er Rechnungen) zurücksetzen? Das kann nicht rückgängig gemacht werden.")) return;
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    ensureUserDefaults(DB);
    await saveData();
    go("dashboard");
  };

  const btnImport2025 = document.getElementById("btnImport2025");
  if (btnImport2025) btnImport2025.onclick = async () => {
    if (!isAdmin()) return;
    if (!confirm("13 Rechnungen aus 2025 sowie 5 Kunden und 3 Artikel hinzufügen?")) return;
    let addedCustomers = 0, addedProducts = 0, addedInvoices = 0;
    IMPORT_2025_DATA.customers.forEach(c => {
      if (!DB.customers.some(x => x.id === c.id || x.name === c.name)) { DB.customers.push(c); addedCustomers++; }
    });
    IMPORT_2025_DATA.products.forEach(p => {
      if (!DB.products.some(x => x.id === p.id || x.name === p.name)) { DB.products.push(p); addedProducts++; }
    });
    IMPORT_2025_DATA.invoices.forEach(inv => {
      if (!DB.invoices.some(x => x.number === inv.number)) { DB.invoices.push(inv); addedInvoices++; }
    });
    await saveData(true);
    showToast(`Import fertig: ${addedInvoices} Rechnungen, ${addedCustomers} Kunden, ${addedProducts} Artikel`);
    render();
  };

  const btnAddUser = document.getElementById("btnAddUser");
  if (btnAddUser) btnAddUser.onclick = () => {
    const tbody = document.getElementById("usersBody");
    const idx = tbody.querySelectorAll("tr").length;
    const row = document.createElement("tr");
    row.dataset.userRow = idx;
    row.innerHTML = `
      <td><input type="text" class="user-name" value=""></td>
      <td><input type="text" class="user-pin" value=""></td>
      <td>
        <select class="user-role">
          <option value="user" selected>Benutzer</option>
          <option value="admin">Admin</option>
        </select>
      </td>
      <td><button type="button" class="btn btn-sm btn-ghost user-remove">${iconTrash()}</button></td>
    `;
    tbody.appendChild(row);
    row.querySelector(".user-remove").addEventListener("click", () => row.remove());
    row.querySelector(".user-name").focus();
  };
  document.querySelectorAll(".user-remove").forEach(btn => {
    btn.addEventListener("click", () => btn.closest("tr").remove());
  });
  const btnSaveUsers = document.getElementById("btnSaveUsers");
  if (btnSaveUsers) btnSaveUsers.onclick = async () => {
    const rows = Array.from(document.querySelectorAll("#usersBody tr"));
    const users = rows.map(r => ({
      name: r.querySelector(".user-name").value.trim(),
      pin: r.querySelector(".user-pin").value.trim(),
      role: r.querySelector(".user-role").value,
    })).filter(u => u.name && u.pin);
    if (!users.length) { showToast("Mindestens ein Benutzer mit Name und PIN wird benötigt"); return; }
    if (!users.some(u => u.role === "admin")) { showToast("Mindestens ein Admin wird benötigt"); return; }
    DB.settings.users = users;
    await saveData();
    showToast("Benutzer gespeichert");
    render();
  };

  const settingsForm = document.getElementById("settingsForm");
  if (settingsForm) settingsForm.onsubmit = async (e) => {
    e.preventDefault();
    if (!isAdmin()) return;
    const comp = DB.settings.company;
    comp.brand = document.getElementById("s_brand").value.trim();
    comp.name = document.getElementById("s_name").value.trim();
    comp.street = document.getElementById("s_street").value.trim();
    comp.zip = document.getElementById("s_zip").value.trim();
    comp.city = document.getElementById("s_city").value.trim();
    comp.owners = document.getElementById("s_owners").value.trim();
    comp.email = document.getElementById("s_email").value.trim();
    comp.phone = document.getElementById("s_phone").value.trim();
    comp.web = document.getElementById("s_web").value.trim();
    comp.bankName = document.getElementById("s_bankName").value.trim();
    comp.iban = document.getElementById("s_iban").value.trim();
    comp.bic = document.getElementById("s_bic").value.trim();
    comp.defaultPaymentDays = Number(document.getElementById("s_days").value) || 14;
    comp.kleinunternehmer = document.getElementById("s_klein").checked;
    DB.settings.nextSeq = Number(document.getElementById("s_nextSeq").value) || DB.settings.nextSeq;
    await saveData();
    showToast("Einstellungen gespeichert");
    render();
  };

  wireInvoiceForm();
}

function renderInPlace(tab) {
  // Re-render just the main area content to keep focus/scroll less jumpy for search inputs
  const mainEl = document.querySelector(".main");
  if (!mainEl) return;
  const activeId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  mainEl.innerHTML = renderMain();
  attachGlobalHandlers();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
  }
}

function wireInvoiceForm() {
  const form = document.getElementById("invoiceForm");
  if (!form) return;

  const itemsBody = document.getElementById("itemsBody");

  function wireRow(row) {
    row.querySelector(".item-qty").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-price").addEventListener("input", recalcItemsTotal);
    row.querySelector(".item-desc").addEventListener("change", (e) => {
      const opts = document.querySelectorAll("#productSuggestions option");
      for (const o of opts) {
        if (o.value === e.target.value) {
          const priceInput = row.querySelector(".item-price");
          if (priceInput && (!priceInput.value || Number(priceInput.value) === 0)) priceInput.value = o.dataset.price;
          recalcItemsTotal();
          break;
        }
      }
    });
    row.querySelector(".item-remove").addEventListener("click", () => {
      if (itemsBody.querySelectorAll("tr").length <= 1) { row.querySelector(".item-desc").value=""; row.querySelector(".item-qty").value=1; row.querySelector(".item-price").value=0; recalcItemsTotal(); return; }
      row.remove();
      recalcItemsTotal();
    });
  }
  itemsBody.querySelectorAll("tr").forEach(wireRow);

  document.getElementById("btnAddItem").addEventListener("click", () => {
    const idx = itemsBody.querySelectorAll("tr").length;
    const wrapper = document.createElement("tbody");
    wrapper.innerHTML = itemRow({ description: "", qty: 1, price: 0 }, idx);
    const row = wrapper.firstElementChild;
    itemsBody.appendChild(row);
    wireRow(row);
    row.querySelector(".item-desc").focus();
  });

  const dateField = document.getElementById("f_date");
  dateField.addEventListener("change", () => {
    // keep due date roughly in sync only if it wasn't manually diverged much — simplest: leave as is.
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const editId = document.getElementById("f_editId").value;
    const customerId = document.getElementById("f_customer").value;
    if (!customerId) { showToast("Bitte einen Kunden auswählen"); return; }
    const date = document.getElementById("f_date").value || todayISO();
    const rows = Array.from(document.querySelectorAll("#itemsBody tr"));
    const items = rows.map(r => ({
      description: r.querySelector(".item-desc").value.trim(),
      qty: Number(r.querySelector(".item-qty").value) || 0,
      price: Number(r.querySelector(".item-price").value) || 0,
    })).filter(it => it.description);

    if (!items.length) { showToast("Bitte mindestens eine Position angeben"); return; }

    const payload = {
      customerId,
      date,
      dueDate: document.getElementById("f_dueDate").value || "",
      deliveryTerm: document.getElementById("f_deliveryTerm").value.trim(),
      deliveryRef: document.getElementById("f_deliveryRef").value.trim(),
      paymentMethod: document.getElementById("f_paymentMethod").value,
      status: document.getElementById("f_status").value,
      items,
    };

    if (editId) {
      const inv = invoiceById(editId);
      Object.assign(inv, payload);
      await saveData();
      showToast("Rechnung aktualisiert");
      go("invoice-detail", editId);
    } else {
      const info = nextInvoiceNumber(date);
      const newInv = { id: uid("i"), number: info.number, ...payload };
      DB.invoices.push(newInv);
      if (DB.settings.seqYear !== info.year) { DB.settings.seqYear = info.year; DB.settings.nextSeq = info.seq + 1; }
      else { DB.settings.nextSeq = info.seq + 1; }
      await saveData();
      showToast("Rechnung erstellt");
      go("invoice-detail", newInv.id);
    }
  });

  recalcItemsTotal();
}

function runPostRenderHooks() {
  if (VIEW.tab === "dashboard") drawMonthChart();
}

   Boot

async function boot() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px;text-align:center;color:#7C4A1E;font-family:Georgia,serif;">Lade FreakyWood CRM…</div>`;
  await loadData();
  render();
}

boot();
